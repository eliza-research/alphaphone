name: Alpha updater Flow JVM diagnostic (hosted, never qualification)
on:
  workflow_dispatch:
    inputs:
      root_go_json:
        description: Exact new Root diagnostic-only one-use GO with bounded owned jcmd grant
        required: true
        type: string
      expected_workflow_sha:
        description: Independently reviewed actual operator commit
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: alpha-updater-intent-${{ fromJSON(inputs.root_go_json).intentId }}
  cancel-in-progress: false
jobs:
  qualify:
    if: github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: operator
          fetch-depth: 1
          submodules: false
          persist-credentials: false
          sparse-checkout: .github/qualification/alpha-updater
      - id: claim
        name: Validate and persist exact fresh intent
        env:
          ROOT_GO_TEXT: ${{ inputs.root_go_json }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B operator/.github/qualification/alpha-updater/claim.py
      - id: claim_artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alpha-updater-intent-${{ steps.claim.outputs.intent_id }}
          path: ${{ runner.temp }}/alpha-updater-intent-claim.json
          retention-days: 7
          if-no-files-found: error
      - name: Checkout exact new Alpha source without setup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: eliza-research/alphaphone
          ref: 8c30b83c5156fdb963daa03fd8452a892e5fa188
          path: source
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Checkout exact normal SDK source at the declared gitlink
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/eliza
          ref: ff04a558747ed426d9d871a319f7b3946f7660e6
          path: source/vendor/eliza
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Guard, prepare normal producer and run exact whole files
        env:
          ROOT_GO_JSON: ${{ runner.temp }}/alpha-updater-root-go.json
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          CLAIM_ARTIFACT_ID: ${{ steps.claim_artifact.outputs.artifact-id }}
          GH_TOKEN: ${{ github.token }}
        run: python3 -I -B operator/.github/qualification/alpha-updater/run.py "$GITHUB_WORKSPACE/source" "$RUNNER_TEMP/alpha-updater-results"
      - name: Retain bounded raw reports and custody, never binaries/source/tools
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: alpha-updater-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/alpha-updater-results/*.json
            ${{ runner.temp }}/alpha-updater-results/*.jsonl
            ${{ runner.temp }}/alpha-updater-results/*.log
            ${{ runner.temp }}/alpha-updater-results/*.tap
            ${{ runner.temp }}/alpha-updater-results/*.xml
          if-no-files-found: warn
          retention-days: 7
