name: Digest process recovery
# Host-runtime evidence only: a synthetic model in the pinned upstream runtime, no
# emulator, account, provider key or network after preparation. It is not a required check.
# Dispatch always runs. The weekly schedule and pin changes on main run only when the CI owner
# sets the repository variable DIGEST_RESTART_AUTOMATIC to "true" (Settings > Variables);
# unset, the lane stays dispatch-only.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'
  push:
    branches: [main]
    paths:
      - upstream.lock.json
      - scripts/test-local-digest-restart.mjs
      - scripts/prepare-local-agent.mjs
      - scripts/local-agent-source.mjs
      - .github/workflows/digest-restart.yml
permissions:
  contents: read
concurrency:
  group: digest-restart-${{ github.ref }}
  cancel-in-progress: true
jobs:
  digest-restart:
    name: Digest process recovery
    if: github.event_name == 'workflow_dispatch' || vars.DIGEST_RESTART_AUTOMATIC == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      RUN_TURBO_CONCURRENCY: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: python3 scripts/ci/resident-phase.py --name prepare --seconds 3600 npm run agent:prepare
        env:
          ALPHA_RUNTIME_GIT_CACHE: ${{ github.workspace }}/vendor/eliza
      # The check writes its evidence directory under TMPDIR; keep it inside the runner temp
      # directory so the result JSON can be uploaded.
      - run: mkdir -p "$RUNNER_TEMP/digest-restart"
      # Not under the phase supervisor: its 10 GiB admission would refuse once the prepared source
      # occupies the runner disk. The check bounds each of its own fixture processes.
      - run: npm run agent:test-digest-restart
        timeout-minutes: 10
        env:
          TMPDIR: ${{ runner.temp }}/digest-restart
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 14
          name: digest-restart-evidence
          if-no-files-found: warn
          path: |
            test-results/resident-ci*
            ${{ runner.temp }}/digest-restart/alpha-digest-crash-*/*.json
            ${{ runner.temp }}/digest-restart/alpha-digest-crash-*/*.jsonl
            ${{ runner.temp }}/digest-restart/alpha-digest-crash-*/*.log
