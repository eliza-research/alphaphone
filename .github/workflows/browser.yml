          node "$QA_ROOT/tooling/validate.cjs" "$QA_ROOT" full browser-three
          node - "$QA_ROOT" <<'NODE'
          const fs=require('node:fs'),p=require('node:path'),root=process.argv[2];
          const read=n=>JSON.parse(fs.readFileSync(p.join(root,'reports',n+'.json')));
          function specs(r){const out=[];function walk(s){out.push(...s.specs||[]);for(const x of s.suites||[])walk(x)}walk(r);return out}
          function passed(r){return specs(r).every(s=>s.tests?.length===1&&s.tests.every(t=>t.results?.length===1&&t.results[0].status==='passed'))}
          const base=read('base-home'),candidate=read('successor-home'),full=read('browser-three');
          if(specs(candidate).length!==2||!passed(candidate)||!passed(full))throw Error('Candidate failure/skip/retry');
          const files=new Set(specs(full).map(s=>s.file.split('/').pop()));
          if(files.size!==3||!['home-inbox.spec.ts','inbox-hostile-attachment.spec.ts','chat-dictation-api.spec.ts'].every(f=>files.has(f)))throw Error('Wrong full-file scope');
          fs.writeFileSync(p.join(root,'receipts','result.json'),JSON.stringify({state:'EXACT_TARGETED_SOURCE_QUALIFICATION_PASS_NOT_RELEASE',source:'cc674a88226cd13c0b8ff72fb7ea797ff1647291',base:'80a6a7a65e0c749ad6a48d7e6e8b9cbd924ee7f2',sdk:'35e0a605b3d560eedec664e79693d5ecc0b5ece3',baseExit:Number(fs.readFileSync(p.join(root,'receipts/base-home.exit'))),causality:passed(base)?'INCONCLUSIVE_BASE_ALSO_PASSED':'BASE_FAILURE_CANDIDATE_PASS_REVIEW_EXACT_ERROR_BEFORE_CAUSAL_CLAIM',candidateHomeCases:2,fullBrowserCases:specs(full).length,nodeFiles:4,browserFiles:3,notNativeOrProviderOrLiveAcceptance:true},null,2)+'\n');
