      - name: Independently close only exact recorded units, including cancellation
        id: cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$QA_ROOT/tooling/cleanup.sh"
          /bin/bash "$QA_ROOT/tooling/cleanup.sh"
          for record in "$QA_ROOT"/receipts/*.unit; do
            test -f "$record" || continue
            test -s "${record%.unit}.closure"
          done
          echo 'closed=true' >> "$GITHUB_OUTPUT"
      - name: Bound the exact upload scope even after a failed or interrupted phase
        id: artifact_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$QA_ROOT/receipts"
          test "$(du -sk "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" | awk '{n+=$1} END{print n}')" -le 524288
          test "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -xdev | wc -l)" -le 20000
          test -z "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -type l -print -quit)"
          if test '${{ steps.cleanup.outputs.closed }}' != true; then
            printf '%s\n' INCOMPLETE_NO_CLOSURE_RECEIPT > "$QA_ROOT/receipts/INCOMPLETE"
            node -e 'const fs=require("node:fs"),p=process.argv[1],prior=fs.existsSync(p)?JSON.parse(fs.readFileSync(p)):null;fs.writeFileSync(p,JSON.stringify({state:"INCOMPLETE_NO_CLOSURE_RECEIPT",preCleanupQualification:prior},null,2)+"\n")' "$QA_ROOT/receipts/result.json"
          fi
          echo 'allowed=true' >> "$GITHUB_OUTPUT"
      - name: Retain only owned reports, logs and receipts, including baseline failures
        if: always() && steps.artifact_gate.outputs.allowed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # existing v7.0.2
        with:
          name: pr790-targeted-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.QA_ROOT }}/logs/
            ${{ env.QA_ROOT }}/reports/
            ${{ env.QA_ROOT }}/receipts/
          retention-days: 3
          if-no-files-found: error
