          cat > "$QA_ROOT/tooling/node-reporter.mjs" <<'REPORTER'
          export default async function* (source) {
            const events=[];
            for await (const event of source) if(['test:pass','test:fail','test:summary'].includes(event.type)) events.push(event);
            yield JSON.stringify(events)+'\n';
          }
          REPORTER
          cat > "$QA_ROOT/tooling/validate.cjs" <<'VALIDATOR'
          const fs=require('node:fs'),p=require('node:path'),assert=require('node:assert/strict');
          const [root,kind,name]=process.argv.slice(2),inventory=JSON.parse(fs.readFileSync(p.join(root,'tooling/inventory.json')));
          const same=(a,b)=>assert.deepEqual([...a].sort(),[...b].sort());
          function specs(r){const out=[];function walk(s){out.push(...s.specs||[]);for(const x of s.suites||[])walk(x)}walk(r);return out;}
          if(kind==='node'){
            const events=JSON.parse(fs.readFileSync(p.join(root,'reports/node-four.json')));
            const cases=events.filter(e=>e.type==='test:pass'||e.type==='test:fail');
            const expected=Object.entries(inventory.inventory).filter(([f])=>!f.includes('/browser/'));
            assert.equal(cases.length,expected.reduce((n,[,names])=>n+names.length,0));
            for(const [file,names] of expected){const rows=cases.filter(e=>e.data.file?.replaceAll('\\','/').endsWith('/'+file));same(rows.map(e=>e.data.name),names);}
            for(const e of cases){assert.equal(e.type,'test:pass');assert.equal(e.data.nesting,0);assert.ok(!e.data.skip&&!e.data.todo);}
          }else{
            const r=JSON.parse(fs.readFileSync(p.join(root,'reports',name+'.json'))),rows=specs(r);
            assert.deepEqual(r.errors,[]);assert.equal(r.stats.skipped,0);
            const expected=kind==='home'?{'test/browser/home-inbox.spec.ts':inventory.homeDiscriminator}:Object.fromEntries(Object.entries(inventory.inventory).filter(([f])=>f.includes('/browser/')));
            assert.equal(rows.length,Object.values(expected).reduce((n,a)=>n+a.length,0));
            for(const [file,names] of Object.entries(expected))same(rows.filter(s=>s.file===file||s.file.endsWith('/'+file)||s.file===p.basename(file)).map(s=>s.title),names);
            for(const s of rows){assert.ok(!s.tags?.includes('@skip'));assert.equal(s.tests.length,1);const t=s.tests[0];assert.equal(t.expectedStatus,'passed');assert.equal(t.results.length,1);assert.equal(t.results[0].retry,0);if(name!=='base-home')assert.equal(t.results[0].status,'passed');else assert.ok(['passed','failed','timedOut'].includes(t.results[0].status));}
          }
          VALIDATOR
          # Hook-free esbuild must use its installed platform binary, never a downloader.
          smoke="import {version,transform} from 'esbuild'; if(version!=='0.28.2')throw Error('Wrong esbuild'); await transform('const value: number = 1',{loader:'ts'});"
          for lane in base successor; do
