name: Browser MVP
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      qualification_scope:
        description: Normal MVP or exact reviewed PR790 targeted qualification
        type: choice
        options: [normal, pr790-targeted]
        default: normal
      cross_browser:
        description: Also qualify Firefox and macOS WebKit storage (expensive; not the Android engine)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Superseded PR runs are cancelled; each main push keeps its own run (see android.yml).
  group: browser-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification_scope != 'pr790-targeted'
    uses: ./.github/workflows/changes.yml
  verify:
    name: Repository verification
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned JSON dependency for host contract tests
        shell: bash
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Prepare pinned SDK for canonical host contract tests
        shell: bash
        run: |
          export ALPHA_BUN="$(command -v bun)"
          test "$("$ALPHA_BUN" --version)" = '1.4.2'
          node scripts/prepare-local-agent.mjs
          prepared_source=$(node --input-type=module -e "import {sourceDirectory,verifySource} from './scripts/local-agent-source.mjs'; import fs from 'node:fs'; const source=sourceDirectory(process.cwd()); verifySource(source,JSON.parse(fs.readFileSync('upstream.lock.json','utf8')).commit); process.stdout.write(source);")
          echo "ALPHA_BUN=$ALPHA_BUN" >> "$GITHUB_ENV"
          echo "ALPHA_CLOUD_COLLECTOR_SOURCE=$prepared_source" >> "$GITHUB_ENV"
      - run: npm run verify
      # Reuses the product dependencies and client projection prepared by npm run verify.
      - name: Build the connected browser proof renderer
        env:
          VITE_ALPHA_CLOUD_RESIDENT: '1'
          VITE_ALPHA_CLOUD_ENVIRONMENT: staging
          VITE_LOCAL_AGENT: '1'
          VITE_ELIZA_RUNTIME_PROFILE: cloud
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ''
          ELIZA_DEV_ALLOW_TEST_MOCKS: ''
        run: |
          npx vite build --outDir ../../test-results/browser-proof-renderer
          node scripts/audit-production-bundle.mjs test-results/browser-proof-renderer
          node scripts/ci/export-browser-proof.mjs renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-renderer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-proof/renderer/
          retention-days: 3
          if-no-files-found: error
      # Recorded develop compare; warns (never networks) when develop cannot reach the pin.
      - name: Report upstream develop reachability
        run: node scripts/verify-upstream.mjs --reachability-only
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_development == 'true' && github.event_name != 'push'
    name: Browser MVP (shard ${{ matrix.shard }}/${{ needs.changes.outputs.browser_total }})
    runs-on: ubuntu-24.04
    # Repository verification runs once, in parallel with all browser shards.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.browser_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser MVP on the flag-on development server
        env:
          # Development shards opt into test mocks, fixtures and device controls explicitly.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
          ALPHA_CI_BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
        run: node scripts/ci/run-browser.mjs --shard=${{ matrix.shard }}/${{ needs.changes.outputs.browser_total }}
      - name: Exercise synthetic local-agent speech profile
        if: matrix.shard == 1 && needs.changes.outputs.browser_speech == 'true'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.env.RUNNER_TEMP + '/alpha-synthetic-owner-token', 'a'.repeat(64), {mode: 0o600});"
          PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/browser-agent-profile-report ELIZA_DEV_ALLOW_TEST_MOCKS=1 VITE_LOCAL_AGENT=1 ALPHA_LOCAL_AGENT_TOKEN_FILE="$RUNNER_TEMP/alpha-synthetic-owner-token" ALPHA_LOCAL_AGENT_ORIGIN=http://127.0.0.1:1 npm run test:browser -- test/browser/browser-agent-tts.spec.ts test/browser/browser-host-disclosure.spec.ts --grep 'local agent TTS|prepared agent audio|connected browser host' --output=test-results/browser-agent-profile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-mvp-shard-${{ matrix.shard }}-of-${{ needs.changes.outputs.browser_total }}
          path: |
            test-results/browser/
            test-results/browser-report/
            test-results/browser-agent-profile/
            test-results/browser-agent-profile-report/
          retention-days: 3
  production:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_production == 'true' && github.event_name != 'push'
    name: Browser production surface (flag off)
    # Runs production-surface.spec.ts and every *.production.spec.ts (playwright.config.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test-mocks bundle records its flag
        run: |
          npm run build:test-mocks -- --outDir ../../test-results/test-mocks-web
          node scripts/audit-production-bundle.mjs test-results/test-mocks-web --expect-test-mocks
      # Builds and previews a flag-off bundle; the flag is deliberately unset here.
      - run: npm run test:browser:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-production-surface
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3
  # Stable required check for the dynamically named shard matrix. The ruleset in
  # docs/ci-cost-policy.md requires this job and Repository verification. Pushes
  # to main deliberately skip the browser lanes (they already ran on the PR).
  result:
    name: Browser MVP result
    needs: [changes, verify, browser, production]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.qualification_scope != 'pr790-targeted')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_SELECTED: ${{ needs.changes.outputs.verify }}
          BROWSER: ${{ needs.browser.result }}
          BROWSER_SELECTED: ${{ github.event_name != 'push' && needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_development }}
          PRODUCTION: ${{ needs.production.result }}
          PRODUCTION_SELECTED: ${{ github.event_name != 'push' && needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_production }}
        run: node scripts/ci/required-result.mjs "changes=$CHANGES" "verify=$VERIFY:$VERIFY_SELECTED" "browser=$BROWSER:$BROWSER_SELECTED" "production=$PRODUCTION:$PRODUCTION_SELECTED"
  storage:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_scope != 'pr790-targeted' && inputs.cross_browser
    name: Browser storage (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    # Linux WebKit lacks MediaRecorder in the hosted build. Run the complete
    # WebKit inventory on macOS so Notes records real audio before storage,
    # reload and playback checks; do not replace recording with a fixture/skip.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    # The storage projects run 297 cases per browser. Unsharded, the hosted Firefox
    # lane took 15-21 minutes of test time and WebKit 19-21 minutes, close to the
    # former 30-minute limit and growing with every storage spec. Two shards keep
    # each job near 10 minutes; the limit leaves room for runner variance.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide an audio server for Firefox recording
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=alpha_test_audio
          pactl set-default-sink alpha_test_audio
          pactl info
      - name: Verify canonical storage and asynchronous Cloud setup
        env:
          # Storage specs run against the flag-on development server.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        # The firefox and webkit projects in playwright.config.ts select the storage specs.
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-storage-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-2
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3

  pr790-targeted:
    name: PR790 exact targeted qualification (not release acceptance)
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_scope == 'pr790-targeted'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      QA_ROOT: ${{ runner.temp }}/pr790-${{ github.run_id }}-${{ github.run_attempt }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pr790-browsers-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # existing v7.0.1
        with:
          ref: 80a6a7a65e0c749ad6a48d7e6e8b9cbd924ee7f2
          path: base
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: cc674a88226cd13c0b8ff72fb7ea797ff1647291
          path: successor
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Admit only the reviewed product and SDK identities before preparation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QA_ROOT"/{logs,reports,receipts,home,tmp,cache,tooling}
          chmod 700 "$QA_ROOT"
          cat > "$QA_ROOT/tooling/cleanup.sh" <<'CLEANUP'
          #!/bin/bash
          set -euo pipefail
          for record in "$QA_ROOT"/receipts/*.unit; do
            test -f "$record" || continue
            unit=$(cat "$record")
            case "$unit" in alpha-pr790-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-*.service) ;; *) exit 125;; esac
            [[ "$unit" =~ ^alpha-pr790-[0-9]+-[0-9]+-[a-z0-9-]+\.service$ ]]
            phase=${record##*/}; phase=${phase%.unit}
            sudo systemctl stop "$unit" || { load=$(sudo systemctl show "$unit" -p LoadState --value 2>/dev/null || true); test "$load" = not-found; }
            # The unit itself records its actual kernel cgroup before running source or tests.
            actual="$QA_ROOT/receipts/$phase.actual-cgroup"
            if ! test -s "$actual"; then echo "INCOMPLETE missing actual cgroup: $phase" >&2; exit 125; fi
            group=$(sed -n 's/^0:://p' "$actual")
            test "$group" = "/system.slice/$unit"
            if test -e "/sys/fs/cgroup$group/cgroup.procs"; then test -z "$(sudo cat "/sys/fs/cgroup$group/cgroup.procs")"; fi
            printf '%s\n' "$group empty-or-absent" > "$QA_ROOT/receipts/$phase.closure"
          done
          CLEANUP
          for lane in base successor; do
            test "$(git -C "$lane" ls-tree HEAD vendor/eliza | awk '{print $1,$2,$3}')" = '160000 commit 35e0a605b3d560eedec664e79693d5ecc0b5ece3'
            test "$(git -C "$lane" config -f .gitmodules --get submodule.vendor/eliza.url)" = https://github.com/elizaOS/eliza.git
            test "$(sha256sum "$lane/package-lock.json" | cut -d' ' -f1)" = 84029a1d65017782877b3cc3e71b81f48f7f7441be2eb892d2df91e83a4ac3ff
            git -C "$lane" diff --exit-code
          done
          test "$(git -C base rev-parse HEAD)" = 80a6a7a65e0c749ad6a48d7e6e8b9cbd924ee7f2
          test "$(git -C successor rev-parse HEAD)" = cc674a88226cd13c0b8ff72fb7ea797ff1647291
      # Ordinary full SDK source at the exact gitlink. No recursive/nested modules or SDK install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/eliza
          ref: 35e0a605b3d560eedec664e79693d5ecc0b5ece3
          path: base/vendor/eliza
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/eliza
          ref: 35e0a605b3d560eedec664e79693d5ecc0b5ece3
          path: successor/vendor/eliza
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # existing v7.1.0
        with:
          node-version-file: successor/.nvmrc
          cache: npm
          cache-dependency-path: successor/package-lock.json
      - name: Bootstrap only the locked ordinary consumer and Chromium, with install hooks suppressed
        shell: bash
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.15.0
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 8388608
          command -v systemd-run; command -v systemctl; command -v setpriv
          for lane in base successor; do
            test "$(git -C "$lane/vendor/eliza" rev-parse HEAD)" = 35e0a605b3d560eedec664e79693d5ecc0b5ece3
            test -z "$(git -C "$lane/vendor/eliza" status --porcelain --untracked-files=normal)"
            (cd "$lane" && timeout --kill-after=15s 360s npm ci --ignore-scripts --include=optional --no-audit --no-fund)
          done
          cd successor
          timeout --kill-after=15s 360s npx --no-install playwright install --with-deps chromium
      - name: Exact isolated sequence, preserving baseline and stopping candidate failures
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 262144
          trap 'status=$?; trap - EXIT INT TERM; /bin/bash "$QA_ROOT/tooling/cleanup.sh" || status=125; exit "$status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          uid=$(id -u); gid=$(id -g)
          # A normal hosted test process cgroup/namespace, not a new test controller.
          run_owned() {
            local phase=$1 seconds=$2 lane=$3
            shift 3
            local unit="alpha-pr790-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${phase}"
            mkdir -p "$QA_ROOT/home/$phase" "$QA_ROOT/tmp/$phase" "$QA_ROOT/cache/$phase" || return 125
            test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 5242880 || return 125
            printf '%s\n' "$unit.service" >"$QA_ROOT/receipts/$phase.unit" || return 125
            local code=0
            if sudo systemd-run --quiet --wait --pipe --unit="$unit" --uid="$uid" --gid="$gid" \
              --working-directory="$GITHUB_WORKSPACE/$lane" \
              -p PrivateNetwork=yes -p NoNewPrivileges=yes -p KillMode=control-group \
              -p MemoryMax=6G -p TasksMax=256 -p CPUQuota=200% \
              -p "RuntimeMaxSec=$seconds" -p TimeoutStopSec=15s -p LimitFSIZE=268435456 \
              --setenv="PATH=$PATH" --setenv="HOME=$QA_ROOT/home/$phase" \
              --setenv="TMPDIR=$QA_ROOT/tmp/$phase" --setenv="NPM_CONFIG_CACHE=$QA_ROOT/cache/$phase" \
              --setenv="PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
              --setenv=CI=true --setenv=NODE_OPTIONS=--max-old-space-size=3072 \
              --setenv=GIT_CONFIG_GLOBAL=/dev/null --setenv=GIT_CONFIG_SYSTEM=/dev/null \
              --setenv=GIT_NO_LAZY_FETCH=1 --setenv=GIT_NO_REPLACE_OBJECTS=1 \
              /bin/bash -c 'cat /proc/self/cgroup > "$1"; shift; exec "$@"' _ "$QA_ROOT/receipts/$phase.actual-cgroup" "$@" >"$QA_ROOT/logs/$phase.log" 2>&1; then code=0; else code=$?; fi
            printf '%s\n' "$code" >"$QA_ROOT/receipts/$phase.exit" || return 125
            /bin/bash "$QA_ROOT/tooling/cleanup.sh" || return 125
            if test -d "$GITHUB_WORKSPACE/$lane/test-results/browser"; then
              mkdir -p "$QA_ROOT/reports/$phase" || return 125
              cp -a "$GITHUB_WORKSPACE/$lane/test-results/browser" "$QA_ROOT/reports/$phase/" || return 125
            fi
            test "$(du -sk "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" | awk '{n+=$1} END{print n}')" -le 524288 || return 125
            test "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -xdev | wc -l)" -le 20000 || return 125
            test -z "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -type l -print -quit)" || return 125
            return "$code"
          }
          node - "$QA_ROOT/receipts/admission.json" <<'NODE'
          const fs=require('node:fs'),c=require('node:crypto'),p=require('node:path');
          const hash=f=>c.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          fs.writeFileSync(process.argv[2],JSON.stringify({workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sourceBase:'80a6a7a65e0c749ad6a48d7e6e8b9cbd924ee7f2',sourceCandidate:'cc674a88226cd13c0b8ff72fb7ea797ff1647291',sdk:'35e0a605b3d560eedec664e79693d5ecc0b5ece3',node:process.version,lockSHA256:hash(p.join(process.env.GITHUB_WORKSPACE,'successor/package-lock.json')),memoryMaxBytes:6442450944,tasksMax:256,cpuQuotaPercent:200,privateNetwork:'loopback-only per test cgroup; bootstrap/artifact network outside',nodeOldSpaceMiB:3072,realProviderCredentialsPassed:false,rootOrDependencyInstallHooksExecuted:false},null,2)+'\n');
          NODE
          cat > "$QA_ROOT/tooling/inventory.json" <<'INVENTORY'
          {"source":"cc674a88226cd13c0b8ff72fb7ea797ff1647291","inventory":{"test/browser/home-inbox.spec.ts":["Home Inbox uses cached unread subjects and aligned text: light","Home Inbox uses cached unread subjects and aligned text: dark","Home Inbox distinguishes complete empty results from partial loaded results","Home Inbox offers Connect email before a connection and never reads mail","Home Inbox retains failure and retires cached subjects on owner change","Home Inbox does not publish a cancelled delayed load as empty or fetched","Home restores only its own saved Inbox while one background header read is pending: recent","Home restores only its own saved Inbox while one background header read is pending: expired","Home restores only its own saved Inbox while one background header read is pending: owner-change-during-restore","Home loads one current Inbox header summary before Inbox is opened, without bodies or rerender reads","opening Inbox consumes the same in-flight Home discovery and header page","Home retires another owner's delayed success without publishing it","Home retires another owner's delayed failure without publishing it","Home does not silently choose a mailbox: ambiguous","Home does not silently choose a mailbox: revoked-choice","Home does not silently choose a mailbox: no-read-grant","Home header warmup preserves existing saved body and folder bytes","Home uses Cloud owner authority independently from optional cache eligibility: no-organization","Home uses Cloud owner authority independently from optional cache eligibility: new-credential","a foreground metadata recheck withdraws a revoked read grant without fetching a page"],"test/browser/inbox-hostile-attachment.spec.ts":["an HTML attachment with script is never rendered: the review is inert text, Save to Files keeps the exact bytes, and opening it in Files runs and loads nothing","an SVG attachment with script is never rendered: the review is inert text, Save to Files keeps the exact bytes, and opening it in Files runs and loads nothing","active content served under a previewable type is shown as literal text or refused, and nothing is saved from a refused file","an oversized attachment is refused before any bytes are requested, and a response larger or other than declared is refused","an account that cannot save unpreviewed types offers nothing for an HTML attachment and requests no bytes","sharing the email with the agent is reviewed first and never includes an attachment name or its bytes","a PNG-and-HTML polyglot is previewed only as a sandboxed image, and URL-like names are refused or shown as plain text"],"test/browser/chat-dictation-api.spec.ts":["API dictation: Transcribe stops into editable local text and appends only to the unsent draft","API dictation: Transcribe cancellation discards late ASR and preserves the original draft","API dictation: unavailable Transcribe retains keyboard and never starts a capture","API dictation: leaving foreground during Transcribe discards late output without changing the draft","API dictation and assistant stay distinct: draft editing never sends, voice conversation submits","API interruptSpeech preserves listening; Mute controls capture with pressed state","API dictation recovery: without an echo canceller, speech during playback never interrupts (input held); a lost Transcribe capture can start again"],"test/white-label-copy.test.mjs":["runtime and native sources carry no hard-coded Eliza product name outside the Cloud configuration","Dedicated hosting review names the configured Cloud service and a neutral agent"],"test/system-notice-collapse.test.mjs":["the recognized texts are byte-equal to the pinned upstream systemNoticeText()","the runtime-error copy names an owner step, not the host operator diagnostics","model-unavailable display is product-neutral while raw protocol recognition and stored bytes remain intact","replayed history with four identical notices and a normal reply shows no notice","notices with no later reply collapse to the latest one, worded for whether the owner was waiting","a stale escalation before a new send is never worded as if that send failed","failed, unfinished, streaming, card and phone receipt rows do not prove chat works","restored history marks saved interrupted replies as unfinished","a live proactive copy after the collapse is not appended again, and unchanged input is returned as is","history and live delivery both mark notices and collapse them before rendering"],"test/action-message-presentation.test.mjs":["completed action projects one truthful result without changing stored history","pending review keeps its existing approve/cancel handlers and shows the destination once","failures remain visible once, user quotes and unrelated later messages are preserved","restored verified browser receipt hides only exact protocol instruction in its turn","no page loaded or read claim; malformed/non-HTTPS destinations refuse","cold history reads one fully matched browser receipt without executing navigation","cold history refuses uncertain, foreign, changed or contradictory browser receipts","automatic live receipt replaces the exact protocol pause without needing an approval card","equal summaries never hide another proposal receipt or an unbound message","a queued proposal and its later exact receipt show one result across the request turn","cross-turn collapse retains pending, foreign, quoted, different and offscreen results","a requested Browser open answered by the agent reply shows that reply once, live or restored","failed, other, unanswered and offscreen-reply receipts stay visible","only a browser proposal receipt that succeeded with its exact summary names its destination"],"test/resident-agent-fixture-provider-status.test.mjs":["provider status is opt-in and existing custom-provider fixtures retain their route","explicit resident fixture exposes an unconfigured Cloud read without inventing keys or inference","provider fixture read returns a copy and does not alter its configured source","provider capability leaves native navigation owner-fence failures observable","every connection-sheet fixture constructor opts in, without changing owner fences"]},"sourceInputs":{"test/browser/home-inbox.spec.ts":{"sha256":"57dd93894b7e260d5216359cda95ffae93bc9d5dd0215c4bd0626e0f29aa7245","count":20},"test/browser/inbox-hostile-attachment.spec.ts":{"sha256":"1c2c465a844e1589bf904db5c65e0abda690dd76fc5af962176b3d07a29fe037","count":7},"test/browser/chat-dictation-api.spec.ts":{"sha256":"90a78c21ed27476e94a41e4aeed71f670b67422d160b865de4f30d43d8593429","count":7},"test/white-label-copy.test.mjs":{"sha256":"ed6d2a704fceca320a2bc1fc0f3d19c52a164844832c25fd0e1924fb11ba8742","count":2},"test/system-notice-collapse.test.mjs":{"sha256":"764c94b54ffc90f64a206249341c9859e024bc538ed2190eefb7813b6b348fb9","count":10},"test/action-message-presentation.test.mjs":{"sha256":"85ed188fcecd5c7214f5de9b9e03ee0d4d614024aabcaf9094e7469e4ddfd009","count":14},"test/resident-agent-fixture-provider-status.test.mjs":{"sha256":"0706f778ed1ecfc8cc7187b6781020477fd8f93725ae0fda1d343bbf3bef2867","count":5}},"homeDiscriminator":["Home retires another owner's delayed success without publishing it","Home retires another owner's delayed failure without publishing it"]}
