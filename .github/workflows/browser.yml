name: Browser MVP
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      qualification_scope:
        description: Normal MVP or exact current-source native voice fixture three-case probe
        type: choice
        options: [normal, current-native-voice-three]
        default: normal
      cross_browser:
        description: Also qualify Firefox and macOS WebKit storage (expensive; not the Android engine)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  # Superseded PR runs are cancelled; each main push keeps its own run (see android.yml).
  group: browser-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    if: github.event_name != 'workflow_dispatch' || inputs.qualification_scope != 'current-native-voice-three'
    uses: ./.github/workflows/changes.yml
  verify:
    name: Repository verification
    needs: changes
    if: needs.changes.outputs.verify == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare pinned JSON dependency for host contract tests
        shell: bash
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Prepare pinned SDK for canonical host contract tests
        shell: bash
        run: |
          export ALPHA_BUN="$(command -v bun)"
          test "$("$ALPHA_BUN" --version)" = '1.4.2'
          node scripts/prepare-local-agent.mjs
          prepared_source=$(node --input-type=module -e "import {sourceDirectory,verifySource} from './scripts/local-agent-source.mjs'; import fs from 'node:fs'; const source=sourceDirectory(process.cwd()); verifySource(source,JSON.parse(fs.readFileSync('upstream.lock.json','utf8')).commit); process.stdout.write(source);")
          echo "ALPHA_BUN=$ALPHA_BUN" >> "$GITHUB_ENV"
          echo "ALPHA_CLOUD_COLLECTOR_SOURCE=$prepared_source" >> "$GITHUB_ENV"
      - run: npm run verify
      # Reuses the product dependencies and client projection prepared by npm run verify.
      - name: Build the connected browser proof renderer
        env:
          VITE_ALPHA_CLOUD_RESIDENT: '1'
          VITE_ALPHA_CLOUD_ENVIRONMENT: staging
          VITE_LOCAL_AGENT: '1'
          VITE_ELIZA_RUNTIME_PROFILE: cloud
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ''
          ELIZA_DEV_ALLOW_TEST_MOCKS: ''
        run: |
          npx vite build --outDir ../../test-results/browser-proof-renderer
          node scripts/audit-production-bundle.mjs test-results/browser-proof-renderer
          node scripts/ci/export-browser-proof.mjs renderer
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-proof-renderer-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-proof/renderer/
          retention-days: 3
          if-no-files-found: error
      # Recorded develop compare; warns (never networks) when develop cannot reach the pin.
      - name: Report upstream develop reachability
        run: node scripts/verify-upstream.mjs --reachability-only
  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_development == 'true' && github.event_name != 'push'
    name: Browser MVP (shard ${{ matrix.shard }}/${{ needs.changes.outputs.browser_total }})
    runs-on: ubuntu-24.04
    # Repository verification runs once, in parallel with all browser shards.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.browser_shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Browser MVP on the flag-on development server
        env:
          # Development shards opt into test mocks, fixtures and device controls explicitly.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
          ALPHA_CI_BROWSER_SPECS: ${{ needs.changes.outputs.browser_specs }}
        run: node scripts/ci/run-browser.mjs --shard=${{ matrix.shard }}/${{ needs.changes.outputs.browser_total }}
      - name: Exercise synthetic local-agent speech profile
        if: matrix.shard == 1 && needs.changes.outputs.browser_speech == 'true'
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.env.RUNNER_TEMP + '/alpha-synthetic-owner-token', 'a'.repeat(64), {mode: 0o600});"
          PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/browser-agent-profile-report ELIZA_DEV_ALLOW_TEST_MOCKS=1 VITE_LOCAL_AGENT=1 ALPHA_LOCAL_AGENT_TOKEN_FILE="$RUNNER_TEMP/alpha-synthetic-owner-token" ALPHA_LOCAL_AGENT_ORIGIN=http://127.0.0.1:1 npm run test:browser -- test/browser/browser-agent-tts.spec.ts test/browser/browser-host-disclosure.spec.ts --grep 'local agent TTS|prepared agent audio|connected browser host' --output=test-results/browser-agent-profile
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-mvp-shard-${{ matrix.shard }}-of-${{ needs.changes.outputs.browser_total }}
          path: |
            test-results/browser/
            test-results/browser-report/
            test-results/browser-agent-profile/
            test-results/browser-agent-profile-report/
          retention-days: 3
  production:
    needs: changes
    if: needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_production == 'true' && github.event_name != 'push'
    name: Browser production surface (flag off)
    # Runs production-surface.spec.ts and every *.production.spec.ts (playwright.config.ts).
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Test-mocks bundle records its flag
        run: |
          npm run build:test-mocks -- --outDir ../../test-results/test-mocks-web
          node scripts/audit-production-bundle.mjs test-results/test-mocks-web --expect-test-mocks
      # Builds and previews a flag-off bundle; the flag is deliberately unset here.
      - run: npm run test:browser:production
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-production-surface
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3
  # Stable required check for the dynamically named shard matrix. The ruleset in
  # docs/ci-cost-policy.md requires this job and Repository verification. Pushes
  # to main deliberately skip the browser lanes (they already ran on the PR).
  result:
    name: Browser MVP result
    needs: [changes, verify, browser, production]
    if: always() && (github.event_name != 'workflow_dispatch' || inputs.qualification_scope != 'current-native-voice-three')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - env:
          CHANGES: ${{ needs.changes.result }}
          VERIFY: ${{ needs.verify.result }}
          VERIFY_SELECTED: ${{ needs.changes.outputs.verify }}
          BROWSER: ${{ needs.browser.result }}
          BROWSER_SELECTED: ${{ github.event_name != 'push' && needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_development }}
          PRODUCTION: ${{ needs.production.result }}
          PRODUCTION_SELECTED: ${{ github.event_name != 'push' && needs.changes.outputs.browser == 'true' && needs.changes.outputs.browser_production }}
        run: node scripts/ci/required-result.mjs "changes=$CHANGES" "verify=$VERIFY:$VERIFY_SELECTED" "browser=$BROWSER:$BROWSER_SELECTED" "production=$PRODUCTION:$PRODUCTION_SELECTED"
  storage:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_scope != 'current-native-voice-three' && inputs.cross_browser
    name: Browser storage (${{ matrix.browser }}, shard ${{ matrix.shard }}/2)
    # Linux WebKit lacks MediaRecorder in the hosted build. Run the complete
    # WebKit inventory on macOS so Notes records real audio before storage,
    # reload and playback checks; do not replace recording with a fixture/skip.
    runs-on: ${{ matrix.browser == 'webkit' && 'macos-15' || 'ubuntu-24.04' }}
    # The storage projects run 297 cases per browser. Unsharded, the hosted Firefox
    # lane took 15-21 minutes of test time and WebKit 19-21 minutes, close to the
    # former 30-minute limit and growing with every storage spec. Two shards keep
    # each job near 10 minutes; the limit leaves room for runner variance.
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        browser: [firefox, webkit]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Provide an audio server for Firefox recording
        if: matrix.browser == 'firefox'
        run: |
          sudo apt-get update
          sudo apt-get install --yes pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=alpha_test_audio
          pactl set-default-sink alpha_test_audio
          pactl info
      - name: Verify canonical storage and asynchronous Cloud setup
        env:
          # Storage specs run against the flag-on development server.
          ELIZA_DEV_ALLOW_TEST_MOCKS: '1'
        # The firefox and webkit projects in playwright.config.ts select the storage specs.
        run: npx playwright test --project=${{ matrix.browser }} --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-storage-${{ matrix.browser }}-shard-${{ matrix.shard }}-of-2
          path: |
            test-results/browser/
            test-results/browser-report/
          retention-days: 3

  current-native-voice-three:
    name: Exact current native-fixture three-case probe (not live Direct or device acceptance)
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_scope == 'current-native-voice-three'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 1c961c7bb893e29293b7f3412f0299aaf10779e7
          path: successor
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - name: Admit only the reviewed product and SDK identities before preparation
        shell: bash
        run: |
          set -euo pipefail
          export QA_ROOT="$RUNNER_TEMP/current-voice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/current-voice-browsers-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "QA_ROOT=$QA_ROOT" "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          mkdir -p "$QA_ROOT"/{logs,reports,receipts,home,tmp,cache,tooling}
          chmod 700 "$QA_ROOT"
          cat > "$QA_ROOT/tooling/cleanup.sh" <<'CLEANUP'
          #!/bin/bash
          set -euo pipefail
          for record in "$QA_ROOT"/receipts/*.unit; do
            test -f "$record" || continue
            unit=$(cat "$record")
            case "$unit" in alpha-currentvoice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-*.service) ;; *) exit 125;; esac
            [[ "$unit" =~ ^alpha-currentvoice-[0-9]+-[0-9]+-[a-z0-9-]+\.service$ ]]
            phase=${record##*/}; phase=${phase%.unit}
            sudo systemctl stop "$unit" || { load=$(sudo systemctl show "$unit" -p LoadState --value 2>/dev/null || true); test "$load" = not-found; }
            # The unit itself records its actual kernel cgroup before running source or tests.
            actual="$QA_ROOT/receipts/$phase.actual-cgroup"
            if ! test -s "$actual"; then echo "INCOMPLETE missing actual cgroup: $phase" >&2; exit 125; fi
            group=$(sed -n 's/^0:://p' "$actual")
            test "$group" = "/system.slice/$unit"
            if test -e "/sys/fs/cgroup$group/cgroup.procs"; then test -z "$(sudo cat "/sys/fs/cgroup$group/cgroup.procs")"; fi
            printf '%s\n' "$group empty-or-absent" > "$QA_ROOT/receipts/$phase.closure"
          done
          CLEANUP
          for lane in successor; do
            test "$(git -C "$lane" ls-tree HEAD vendor/eliza | awk '{print $1,$2,$3}')" = '160000 commit b60a34b62025a1736e1a09723002feed2d8114fe'
            test "$(git -C "$lane" config -f .gitmodules --get submodule.vendor/eliza.url)" = https://github.com/elizaOS/eliza.git
            test "$(sha256sum "$lane/package-lock.json" | cut -d' ' -f1)" = 84029a1d65017782877b3cc3e71b81f48f7f7441be2eb892d2df91e83a4ac3ff
            git -C "$lane" diff --exit-code
          done
          test "$(git -C successor rev-parse HEAD)" = 1c961c7bb893e29293b7f3412f0299aaf10779e7
      # Ordinary full SDK source at the exact gitlink. No recursive/nested modules or SDK install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: elizaOS/eliza
          ref: b60a34b62025a1736e1a09723002feed2d8114fe
          path: successor/vendor/eliza
          fetch-depth: 1
          submodules: false
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # existing v7.1.0
        with:
          node-version-file: successor/.nvmrc
          cache: npm
          cache-dependency-path: successor/package-lock.json
      - name: Bootstrap only the locked ordinary consumer and Chromium, with install hooks suppressed
        shell: bash
        env:
          GIT_CONFIG_GLOBAL: /dev/null
          GIT_CONFIG_SYSTEM: /dev/null
          GIT_NO_LAZY_FETCH: '1'
          GIT_NO_REPLACE_OBJECTS: '1'
        run: |
          set -euo pipefail
          test "$(node --version)" = v24.15.0
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 8388608
          command -v systemd-run; command -v systemctl; command -v setpriv
          for lane in successor; do
            test "$(git -C "$lane/vendor/eliza" rev-parse HEAD)" = b60a34b62025a1736e1a09723002feed2d8114fe
            test -z "$(git -C "$lane/vendor/eliza" status --porcelain --untracked-files=normal)"
            (cd "$lane" && timeout --kill-after=15s 360s npm ci --ignore-scripts --include=optional --no-audit --no-fund)
          done
          cd successor
          timeout --kill-after=15s 360s npx --no-install playwright install --with-deps chromium
      - name: Exact isolated current-source three-case send preparation probe
        shell: bash
        run: |
          set -euo pipefail
          ulimit -f 262144
          trap 'status=$?; trap - EXIT INT TERM; /bin/bash "$QA_ROOT/tooling/cleanup.sh" || status=125; exit "$status"' EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          uid=$(id -u); gid=$(id -g)
          # A normal hosted test process cgroup/namespace, not a new test controller.
          run_owned() {
            local phase=$1 seconds=$2 lane=$3
            shift 3
            local unit="alpha-currentvoice-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${phase}"
            mkdir -p "$QA_ROOT/home/$phase" "$QA_ROOT/tmp/$phase" "$QA_ROOT/cache/$phase" || return 125
            test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 5242880 || return 125
            printf '%s\n' "$unit.service" >"$QA_ROOT/receipts/$phase.unit" || return 125
            local code=0
            if sudo systemd-run --quiet --wait --pipe --unit="$unit" --uid="$uid" --gid="$gid" \
              --working-directory="$GITHUB_WORKSPACE/$lane" \
              -p PrivateNetwork=yes -p NoNewPrivileges=yes -p KillMode=control-group \
              -p MemoryMax=6G -p TasksMax=256 -p CPUQuota=200% \
              -p "RuntimeMaxSec=$seconds" -p TimeoutStopSec=15s -p LimitFSIZE=268435456 \
              --setenv="PATH=$PATH" --setenv="HOME=$QA_ROOT/home/$phase" \
              --setenv="TMPDIR=$QA_ROOT/tmp/$phase" --setenv="NPM_CONFIG_CACHE=$QA_ROOT/cache/$phase" \
              --setenv="PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" \
              --setenv=CI=true --setenv=NODE_OPTIONS=--max-old-space-size=3072 \
              --setenv=GIT_CONFIG_GLOBAL=/dev/null --setenv=GIT_CONFIG_SYSTEM=/dev/null \
              --setenv=GIT_NO_LAZY_FETCH=1 --setenv=GIT_NO_REPLACE_OBJECTS=1 \
              /bin/bash -c 'cat /proc/self/cgroup > "$1"; shift; exec "$@"' _ "$QA_ROOT/receipts/$phase.actual-cgroup" "$@" >"$QA_ROOT/logs/$phase.log" 2>&1; then code=0; else code=$?; fi
            printf '%s\n' "$code" >"$QA_ROOT/receipts/$phase.exit" || return 125
            /bin/bash "$QA_ROOT/tooling/cleanup.sh" || return 125
            if test -d "$GITHUB_WORKSPACE/$lane/test-results/browser"; then
              mkdir -p "$QA_ROOT/reports/$phase" || return 125
              cp -a "$GITHUB_WORKSPACE/$lane/test-results/browser" "$QA_ROOT/reports/$phase/" || return 125
            fi
            test "$(du -sk "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" | awk '{n+=$1} END{print n}')" -le 524288 || return 125
            test "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -xdev | wc -l)" -le 20000 || return 125
            test -z "$(find "$QA_ROOT/logs" "$QA_ROOT/reports" "$QA_ROOT/receipts" -type l -print -quit)" || return 125
            return "$code"
          }
          node - "$QA_ROOT/receipts/admission.json" <<'NODE'
          const fs=require('node:fs'),c=require('node:crypto'),p=require('node:path');
          const hash=f=>c.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          fs.writeFileSync(process.argv[2],JSON.stringify({workflowCommit:process.env.GITHUB_SHA,runId:process.env.GITHUB_RUN_ID,attempt:process.env.GITHUB_RUN_ATTEMPT,sourceCandidate:'1c961c7bb893e29293b7f3412f0299aaf10779e7',sdk:'b60a34b62025a1736e1a09723002feed2d8114fe',node:process.version,lockSHA256:hash(p.join(process.env.GITHUB_WORKSPACE,'successor/package-lock.json')),memoryMaxBytes:6442450944,tasksMax:256,cpuQuotaPercent:200,privateNetwork:'loopback-only per test cgroup; bootstrap/artifact network outside',nodeOldSpaceMiB:3072,realProviderCredentialsPassed:false,rootOrDependencyInstallHooksExecuted:false},null,2)+'\n');
          NODE
          cat > "$QA_ROOT/tooling/expected.json" <<'EXPECTED'
          {"source":"1c961c7bb893e29293b7f3412f0299aaf10779e7","productParent":"2647bb09738f7213da09a66d8bc821f0821e6164","sdk":"b60a34b62025a1736e1a09723002feed2d8114fe","file":"test/browser/chat-dictation-api.spec.ts","project":"chromium","names":["API dictation and assistant stay distinct: draft editing never sends, voice conversation submits","API interruptSpeech preserves listening; Mute controls capture with pressed state","API dictation recovery: without an echo canceller, speech during playback never interrupts; a lost Transcribe capture can start again"],"selector":"(?:API\\ dictation\\ and\\ assistant\\ stay\\ distinct:\\ draft\\ editing\\ never\\ sends,\\ voice\\ conversation\\ submits|API\\ interruptSpeech\\ preserves\\ listening;\\ Mute\\ controls\\ capture\\ with\\ pressed\\ state|API\\ dictation\\ recovery:\\ without\\ an\\ echo\\ canceller,\\ speech\\ during\\ playback\\ never\\ interrupts;\\ a\\ lost\\ Transcribe\\ capture\\ can\\ start\\ again)$"}
          EXPECTED
          cat > "$QA_ROOT/tooling/validate.cjs" <<'VALIDATOR'
          const fs=require('node:fs'),p=require('node:path'),assert=require('node:assert/strict');
          const [root,phase]=process.argv.slice(2),expected=JSON.parse(fs.readFileSync(p.join(root,'tooling/expected.json')));
          const read=name=>JSON.parse(fs.readFileSync(p.join(root,'reports',name+'.json')));
          function specs(r){const out=[];function walk(s){out.push(...s.specs||[]);for(const x of s.suites||[])walk(x)}walk(r);return out;}
          const object=x=>!!x&&typeof x==='object'&&!Array.isArray(x);
          function keys(x,allowed){assert.ok(object(x),'Expected bounded metadata object');assert.ok(Object.keys(x).every(k=>allowed.includes(k)),'Unexpected metadata field');}
          const count=n=>Number.isSafeInteger(n)&&n>=0;
          function errorFields(e,messageAllowed){
           keys(e,['type','name','code','causeName','causeCode',...(messageAllowed?['message']:[])]);
           assert.ok(['object','string','number','boolean','undefined','function','symbol','bigint'].includes(e.type),'Wrong error type metadata');
           for(const k of ['name','code','causeName','causeCode'])if(e[k]!==undefined)assert.ok(typeof e[k]==='string'&&/^[A-Za-z0-9_.-]{1,80}$/.test(e[k]),'Unbounded error token');
           if(e.message!==undefined)assert.ok(typeof e.message==='string'&&e.message.length<=256&&!/[\u0000-\u001f\u007f\u2028\u2029]/.test(e.message),'Public error message must be bounded single-line');
          }
          function attachmentJSON(a){
           // TestInfo.attach(Buffer) is retained as inline base64 in the JSON reporter. No arbitrary path reads.
           assert.ok(typeof a.body==='string'&&a.body.length>0&&a.body.length<=43692,'Missing or oversized inline attachment bytes');
           assert.ok(/^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$/.test(a.body),'Invalid inline base64');
           const bytes=Buffer.from(a.body,'base64');assert.ok(bytes.length>0&&bytes.length<=32768&&bytes.toString('base64')===a.body,'Noncanonical/oversized metadata');
           const text=bytes.toString('utf8');assert.ok(Buffer.from(text,'utf8').equals(bytes),'Invalid metadata UTF8');
           const m=JSON.parse(text);assert.ok(object(m)&&m.version===1,'Wrong metadata version');
           if(m.diagnosticCaptureFailed===true){keys(m,['version','diagnosticCaptureFailed','errorType','errorName']);assert.ok(typeof m.errorType==='string'&&typeof m.errorName==='string'&&m.errorName.length<=80,'Wrong failed-capture metadata');return {publicSnapshotQuality:'INSUFFICIENT_DIAGNOSTIC_CAPTURE_FAILED_UNKNOWN',sendBoundaryQuality:'INSUFFICIENT_DIAGNOSTIC_CAPTURE_FAILED_UNKNOWN',sendObservationCount:0};}
           keys(m,['version','scope','snapshotAvailable','snapshot','counts','nativeRequests','notifications','sendPreparation']);
           assert.ok(m.scope==='synthetic-voice-fixture-failure-only'&&typeof m.snapshotAvailable==='boolean','Wrong metadata scope/snapshot flag');
           const numericCounts=['captures','stops','asrRoutes','closeRoutes','routeFrames','syntheses','plays','playbackStops','posts','unexpectedNativeRequests','forbiddenVoiceRequests'];
