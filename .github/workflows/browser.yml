name: Browser MVP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    name: Browser MVP (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Includes dependency/browser installation and verification before ~375 UI cases.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Verification is independent of the browser shard; run it once per workflow.
      - run: npm run verify
        if: matrix.shard == 1
      - run: npm run test:browser -- --shard=${{ matrix.shard }}/3
      - name: Exercise synthetic local-agent speech profile
        if: matrix.shard == 1
        run: |
          node --input-type=module -e "import fs from 'node:fs'; fs.writeFileSync(process.env.RUNNER_TEMP + '/alpha-synthetic-owner-token', 'a'.repeat(64), {mode: 0o600});"
          PLAYWRIGHT_HTML_OUTPUT_DIR=test-results/browser-agent-profile-report VITE_LOCAL_AGENT=1 ALPHA_LOCAL_AGENT_TOKEN_FILE="$RUNNER_TEMP/alpha-synthetic-owner-token" ALPHA_LOCAL_AGENT_ORIGIN=http://127.0.0.1:1 npm run test:browser -- test/browser/browser-agent-recording.spec.ts test/browser/browser-agent-tts.spec.ts --grep 'rendered browser recording|local agent TTS|prepared agent audio' --output=test-results/browser-agent-profile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-mvp-shard-${{ matrix.shard }}-of-3
          path: |
            test-results/browser/
            test-results/browser-report/
            test-results/browser-agent-profile/
            test-results/browser-agent-profile-report/
          retention-days: 14
