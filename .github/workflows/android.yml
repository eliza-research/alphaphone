name: Android foundation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      provider_only:
        description: Diagnose the disposable WebView fixture without app builds
        type: boolean
        default: false
      expected_sha:
        description: Exact reviewed commit required for provider-only diagnosis
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && inputs.provider_only && '-provider-only' || '' }}
  cancel-in-progress: true
jobs:
  build:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.provider_only) }}
    outputs:
      artifact_id: ${{ steps.apks.outputs.artifact-id }}
      manifest_sha256: ${{ steps.bundle.outputs.manifest_sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify
        # Push/PR verification already runs once in Browser MVP. Preserve it
        # when this workflow is dispatched independently for an APK build.
        if: github.event_name == 'workflow_dispatch'
      - run: node --test vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # Cache only acquisition inputs. Every hit is size/hash verified; generated
      # AARs, extracted sources and models are rebuilt in this clean job.
      - uses: actions/cache@v4
        with:
          path: scripts/local-speech/downloads
          key: speech-downloads-${{ runner.os }}-${{ hashFiles('scripts/local-speech/download-manifest.json') }}
      - name: Acquire verified speech source, models and license references
        timeout-minutes: 15
        run: |
          python3 scripts/local-speech/acquire-downloads.py
          python3 scripts/local-speech/make-lexicon.py
      - name: Build and qualify both no-eSpeak runtime ABIs
        timeout-minutes: 65
        run: |
          for abi in arm64-v8a x86_64; do
            python3 scripts/local-speech/build-no-espeak.py --abi "$abi" --ndk "$ANDROID_NDK_HOME" --jobs 2
            python3 scripts/local-speech/strip-runtime.py --abi "$abi" --ndk "$ANDROID_NDK_HOME"
          done
          python3 scripts/local-speech/verify-source.py
      - name: Assemble and verify speech APK inputs
        run: |
          python3 scripts/local-speech/prepare-assets.py
          python3 scripts/local-speech/assemble-runtime.py
          python3 scripts/local-speech/install-generated.py --repository "$GITHUB_WORKSPACE"
      - name: Prepare pinned native lifecycle sources
        run: node scripts/prepare-local-agent.mjs --source-only
      - run: npm run android:build
      - run: npm run aosp:stage -- --apk artifacts/launcher-debug.apk --development
      - name: Stage immutable six-APK smoke bundle
        id: bundle
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os, shutil
          root = Path.cwd()
          bundle = root / 'artifacts/smoke-bundle'
          bundle.mkdir()
          hashes = {}
          for variant in ('standalone', 'launcher'):
              for kind in ('debug', 'release-unsigned', 'androidTest'):
                  name = variant + '-' + kind + '.apk'
                  source = root / ('android/app/build/outputs/apk/androidTest/' + variant + '/debug/app-' + variant + '-debug-androidTest.apk') if kind == 'androidTest' else root / 'artifacts' / name
                  assert source.is_file() and not source.is_symlink(), str(source)
                  shutil.copyfile(source, bundle / name)
                  hashes[name] = hashlib.sha256(source.read_bytes()).hexdigest()
                  assert hashlib.sha256((bundle / name).read_bytes()).hexdigest() == hashes[name]
          manifest = bundle / 'apk-manifest.json'
          manifest.write_text(json.dumps(hashes, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('manifest_sha256=' + hashlib.sha256(manifest.read_bytes()).hexdigest() + '\n')
          PYTHON
      - uses: actions/upload-artifact@v4
        id: apks
        with:
          name: android-smoke-apks-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/smoke-bundle/
          if-no-files-found: error
          # APKs are already compressed; avoid recompressing the six-APK bundle.
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-evidence
          # Prepared upstream checkouts are reproducible inputs, not evidence.
          path: |
            artifacts/
            !artifacts/**/*.apk
            !artifacts/smoke-bundle/
            !artifacts/local-agent-*/**
            !artifacts/mobile-workflow-worker-*/**
            test-results/
            android/app/build/reports/
            scripts/local-speech/build-*/build.log
            scripts/local-speech/build-*/qualification*.json
            scripts/local-speech/generated/lexicon-provenance.json
            android/local-speech/runtime-manifest.json
            android/local-speech/src/main/assets/local-speech/v1/manifest.json
          retention-days: 14
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      # Smoke imports only checked-in scripts and Node builtins; no native build.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: artifacts/smoke-bundle
          merge-multiple: true
      - name: Verify exact build-job APK bundle
        env:
          EXPECTED_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import hashlib, json, os
          bundle = Path('artifacts/smoke-bundle')
          manifest = bundle / 'apk-manifest.json'
          assert hashlib.sha256(manifest.read_bytes()).hexdigest() == os.environ['EXPECTED_MANIFEST_SHA256'], 'Bundle manifest differs from build job output'
          hashes = json.loads(manifest.read_text())
          expected = {variant + '-' + kind + '.apk' for variant in ('standalone', 'launcher') for kind in ('debug', 'release-unsigned', 'androidTest')}
          assert set(hashes) == expected, 'Bundle must contain exactly six approved APKs'
          assert {p.name for p in bundle.iterdir()} == expected | {'apk-manifest.json'}, 'Unexpected or missing bundle members'
          for name, digest in hashes.items():
              path = bundle / name
              assert path.is_file() and not path.is_symlink(), name
              assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'APK hash mismatch: ' + name
          print('Verified all six APKs against same-run build manifest')
          PYTHON
      - name: Require fresh emulator capacity
        run: |
          df -h "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$HOME"
          python3 - <<'PYTHON'
          from pathlib import Path
          import json, os, shutil
          evidence = Path('test-results/emulator-disk-preflight')
          evidence.mkdir(parents=True)
          free = {name: shutil.disk_usage(path).free for name, path in {'workspace': Path.cwd(), 'androidSdk': Path(os.environ['ANDROID_HOME']), 'avdHome': Path.home()}.items()}
          state = {'freeBytes': free, 'requiredFreeBytes': 8 * 1024 ** 3}
          state['passed'] = min(free.values()) >= state['requiredFreeBytes']
          (evidence / 'result.json').write_text(json.dumps(state, indent=2) + '\n')
          print(json.dumps(state, indent=2))
          assert state['passed'], 'Insufficient fresh-runner emulator capacity'
          PYTHON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          # Chromium recommends >=4 GB guest storage for WebView development.
          # Keep host capacity admission; overlay scratch is separately bounded to 512 MiB.
          disk-size: 4096M
          # Disable host Vulkan while qualifying SurfaceFlinger across framework restarts.
          # Provider replacement is confined to this fresh disposable AOSP image.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -writable-system -append-userspace-opt 'androidboot.boot_devices=pci0000:00/0000:00:03.0 pci0000:00/0000:00:05.0 pci0000:00/0000:00:06.0'
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 node scripts/prepare-ci-emulator.mjs
            ANDROID_SERIAL=emulator-5554 ALPHA_DISPOSABLE_WEBVIEW_FIXTURE=api35-default-x86_64 node scripts/prepare-ci-webview.mjs
            ANDROID_SERIAL=emulator-5554 ALPHA_BUILD_ARCHIVE=artifacts/smoke-bundle npm run android:smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-smoke-evidence
          path: |
            test-results/
            !test-results/ci-webview-provider/chromium.zip
            !test-results/ci-webview-provider/SystemWebView.apk
          retention-days: 14
  provider-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.provider_only }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Admit exact diagnostic source
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          python3 - <<'PYTHON'
          import os, re, subprocess
          expected = os.environ['EXPECTED_SHA']
          assert re.fullmatch('[a-f0-9]{40}', expected), 'Exact reviewed SHA required'
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == expected
          assert os.environ['GITHUB_SHA'] == expected
          PYTHON
      # Smoke imports only checked-in scripts and Node builtins; no native build.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Require fresh emulator capacity
        run: |
          df -h "$GITHUB_WORKSPACE" "$ANDROID_HOME" "$HOME"
          python3 - <<'PYTHON'
          from pathlib import Path
          import json, os, shutil
          evidence = Path('test-results/emulator-disk-preflight')
          evidence.mkdir(parents=True)
          free = {name: shutil.disk_usage(path).free for name, path in {'workspace': Path.cwd(), 'androidSdk': Path(os.environ['ANDROID_HOME']), 'avdHome': Path.home()}.items()}
          state = {'freeBytes': free, 'requiredFreeBytes': 8 * 1024 ** 3}
          state['passed'] = min(free.values()) >= state['requiredFreeBytes']
          (evidence / 'result.json').write_text(json.dumps(state, indent=2) + '\n')
          print(json.dumps(state, indent=2))
          assert state['passed'], 'Insufficient fresh-runner emulator capacity'
          PYTHON
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          # Chromium recommends >=4 GB guest storage for WebView development.
          # Keep host capacity admission; overlay scratch is separately bounded to 512 MiB.
          disk-size: 4096M
          # Disable host Vulkan while qualifying SurfaceFlinger across framework restarts.
          # Provider replacement is confined to this fresh disposable AOSP image.
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -writable-system -append-userspace-opt 'androidboot.boot_devices=pci0000:00/0000:00:03.0 pci0000:00/0000:00:05.0 pci0000:00/0000:00:06.0'
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 node scripts/prepare-ci-emulator.mjs
            ANDROID_SERIAL=emulator-5554 ALPHA_DISPOSABLE_WEBVIEW_FIXTURE=api35-default-x86_64 node scripts/prepare-ci-webview.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: provider-only-diagnostics-${{ github.run_id }}
          path: |
            test-results/ci-webview-provider/*.json
            test-results/ci-webview-provider/*.txt
            test-results/android-fixture/*.json
            test-results/emulator-disk-preflight/*.json
          retention-days: 14
