name: Android foundation
on:
  # Main pushes rebuild both variants so a broken merge is visible on main itself.
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Superseded PR runs are cancelled. Each main push gets its own group: a shared
  # group would still cancel a queued main run when a third push arrives.
  group: android-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
  changes:
    uses: ./.github/workflows/changes.yml
  build:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Android native toolchain
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # Native engine wrappers (prepare-embedding-host) require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: npm ci
      - name: Verify standalone manual qualification
        if: github.event_name == 'workflow_dispatch'
        run: npm run verify
      - run: node --test vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # On-device speech is the shared paradee-voice library on libelizainference (llama.cpp/ggml):
      # Paradee-8M TTS with misaki G2P and the bundle's ASR slot. This lane stages no native voice
      # outputs, so Gradle compiles the real Java API unpackaged and the APKs report speech unavailable.
      - name: Prepare pinned native lifecycle sources
        run: node scripts/prepare-local-agent.mjs --source-only
      # Distribution build: flag-off whatever the runner exports. This job stages no
      # resident runtime, so releases are recorded distributable:false (APK-build
      # evidence only); the resident workflow builds and verifies PACKAGED releases.
      # This lane never runs instrumentation; manual build archives still include it.
      - name: Record tracked source frame before normal Android build
        timeout-minutes: 1
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py --source-frame
      - name: Build flag-off distribution APKs
        env:
          ELIZA_DEV_ALLOW_TEST_MOCKS: ""
          VITE_ELIZA_DEV_ALLOW_TEST_MOCKS: ""
        run: npm run android:build -- --allow-unpackaged-runtime --skip-instrumentation
      # Run the owning bridge fixture with actual production JavaCompile outputs in
      # this same source/SDK/toolchain job. This command assembles no extra APK.
      - name: Prepare normal host-test JSON for Calendar bridge
        timeout-minutes: 1
        run: bash scripts/ci/prepare-host-test-json.sh
      - name: Qualify actual Calendar bridge in normal Java compile context
        timeout-minutes: 4
        env:
          ALPHA_CALENDAR_BRIDGE_EXPECTED_HEAD: ${{ github.sha }}
        run: python scripts/ci/calendar-bridge.py
      - name: Require test-mock-free distribution
        run: |
          node scripts/audit-production-bundle.mjs web-dist
          node - <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/apk-manifest.json', 'utf8'));
          if (manifest.testMocks !== false || manifest.demoEntryPoints !== false) throw new Error('Distribution APKs must be testMocks:false and demoEntryPoints:false');
          if (manifest.results.length !== 4 || manifest.results.some(row => row.testMocks !== false || row.bundleAudit !== 'passed')) throw new Error('Every distribution APK must pass the flag-off bundle audit');
          console.log(JSON.stringify({ testMocks: manifest.testMocks, demoEntryPoints: manifest.demoEntryPoints, version: manifest.version, signing: manifest.signing.release }, null, 2));
          NODE
      - run: npm run aosp:stage -- --apk artifacts/launcher-debug.apk --development
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-distribution-apks-${{ github.run_id }}-${{ github.run_attempt }}
          # R8 mappings travel with the exact APKs they deobfuscate.
          path: |
            artifacts/*.apk
            artifacts/mapping/*.txt
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-build-evidence
          path: |
            artifacts/*.json
            # Written offline by the build beside the APKs it verified (scripts/generate-sbom.mjs).
            artifacts/sbom/*.json
            artifacts/aosp/
            !artifacts/aosp/**/*.apk
            test-results/
            android/app/build/reports/
            android/voice-host/qualified-voice-host.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/inputs.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/taskgraph.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/bridge.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/receipt/result.json
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/gradle.log
            ${{ runner.temp }}/alpha-calendar-bridge-${{ github.run_id }}-${{ github.run_attempt }}/supervisor.json
          retention-days: 3
  # Stable required check. The ruleset in docs/ci-cost-policy.md requires this job:
  # it passes when the change gate did not select Android and fails when the
  # selected build failed, was cancelled or did not run.
  result:
    name: Android foundation result
    needs: [changes, build]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/ci
      - env:
          SELECTED: ${{ needs.changes.outputs.android }}
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
        run: node scripts/ci/required-result.mjs "changes=$CHANGES" "build=$BUILD:$SELECTED"
