name: Resident Android embedding component only
run-name: cc8 ARM64 component only - ${{ github.ref_name }} - ${{ github.run_id }}
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: alpha-cc8-embedding-component
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
          persist-credentials: false
      - name: Bind reviewed control bytes
        run: |
          echo "865910bb8a7d9fcbd915bed74162f9dd45962e689e8bdaff8eb506027023087e  control/scripts/ci/component-build.py" | sha256sum --check
          echo "69ea1614298dea35dab352f2e192aee543246255dc25562df6cab230ee0b675b  control/scripts/ci/component-inputs.json" | sha256sum --check
          echo "c62dfb24991aefac9d397d040d40cf971e02531ec14cf836796367c05217ff08  control/scripts/ci/owned-linux-supervisor.py" | sha256sum --check
          echo "4a793608a4c548aec77a3ec1da5c2bea7975e7b2ee1fc1bfaf696f6a6e282ac6  control/scripts/ci/test-owned-linux-supervisor.py" | sha256sum --check
          echo "f686d836cfdeab9e7c4c7e4c262eb9111cb2c1ce2ad12d58dbf6b1abf46b53e5  control/scripts/ci/check_source.py" | sha256sum --check
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Prepare exact compiler and source inputs
        timeout-minutes: 12
        run: |
          sdkmanager 'ndk;28.2.13676358'
          python3 -m pip install cmake==4.0.3
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake libtool gperf
          git init product
          git -C product -c core.hooksPath=/dev/null -c gc.auto=0 -c core.fsmonitor=false fetch --filter=blob:none --no-tags https://github.com/eliza-research/alphaphone.git f8d31f6d4c84b10ad7d1e1cd45043427399f2ff6
          git -C product -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          git init product/vendor/eliza
          git -C product/vendor/eliza -c core.hooksPath=/dev/null -c gc.auto=0 -c core.fsmonitor=false fetch --filter=blob:none --no-tags https://github.com/elizaOS/eliza.git d38e4ec7fad5952fdf4f40d4c809240d639792ac
          git -C product/vendor/eliza -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          git init product/vendor/eliza/plugins/plugin-local-inference/native/llama.cpp
          git -C product/vendor/eliza/plugins/plugin-local-inference/native/llama.cpp -c core.hooksPath=/dev/null -c gc.auto=0 -c core.fsmonitor=false fetch --filter=blob:none --no-tags https://github.com/elizaOS/llama.cpp.git cc8c979157e1f577448d8b8c6ff598b7cfc3d661
          git -C product/vendor/eliza/plugins/plugin-local-inference/native/llama.cpp -c core.hooksPath=/dev/null checkout --detach FETCH_HEAD
          git -C product/vendor/eliza/plugins/plugin-local-inference/native/llama.cpp -c core.hooksPath=/dev/null submodule update --init --recursive
      - name: Qualify Linux process ownership on inert fixtures
        timeout-minutes: 2
        run: python3 control/scripts/ci/test-owned-linux-supervisor.py
      - name: Compile current ARM64 component only
        env:
          ELIZA_NDK_VERSION: 28.2.13676358
          CMAKE_BUILD_PARALLEL_LEVEL: '2'
        run: |
          python3 control/scripts/ci/owned-linux-supervisor.py --manifest "$GITHUB_WORKSPACE/control/scripts/ci/component-inputs.json" --output "$GITHUB_WORKSPACE/component-monitor" --write-root "$GITHUB_WORKSPACE/component-output" -- python3 control/scripts/ci/component-build.py --source "$GITHUB_WORKSPACE/product" --manifest "$GITHUB_WORKSPACE/control/scripts/ci/component-inputs.json" --output "$GITHUB_WORKSPACE/component-output"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: cc8-arm64-embedding-component-${{ github.run_id }}
          retention-days: 3
          if-no-files-found: error
          path: |
            component-output/export/
            component-monitor/
            LINUX-SUPERVISOR-FIXTURES.json
            component-output/INTENT.json
