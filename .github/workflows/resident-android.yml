name: Resident Android exact source
on:
  workflow_dispatch:
  # Optional automatic PACKAGED qualification. Both triggers are inert unless the
  # repository variable ELIZA_RESIDENT_QUALIFICATION is "push" (every main commit)
  # or "nightly" (once a day, default branch only). See docs/ci-cost-policy.md.
  push:
    branches: [main, develop]
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
concurrency:
  # Dispatches on one ref supersede each other. Push and nightly runs (mostly skipped
  # when the opt-in variable is unset) get their own group, so they never cancel a
  # running dispatched qualification.
  group: resident-${{ github.event_name == 'workflow_dispatch' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}
jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && vars.ELIZA_RESIDENT_QUALIFICATION == 'push') ||
      (github.event_name == 'schedule' && vars.ELIZA_RESIDENT_QUALIFICATION == 'nightly')
    # All consumers select the reviewed NDK before unused image SDKs are removed.
    env:
      ANDROID_NDK: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
      ANDROID_NDK_LATEST_HOME: /usr/local/lib/android/sdk/ndk/28.2.13676358
    outputs:
      artifact_id: ${{ steps.apks.outputs.artifact-id }}
      source_sha: ${{ github.sha }}
      manifest_sha256: ${{ steps.freeze.outputs.sha256 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      # Fresh hosted image provisioning only. Never prune source, dependency
      # caches, selected Android tools or generated artifacts during a running phase.
      - name: Provision build capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          test "$ANDROID_NDK_HOME" = /usr/local/lib/android/sdk/ndk/28.2.13676358
          test "$ANDROID_NDK" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_ROOT" = "$ANDROID_NDK_HOME"
          test "$ANDROID_NDK_LATEST_HOME" = "$ANDROID_NDK_HOME"
          test "$(realpath "$ANDROID_NDK_HOME")" = "$ANDROID_NDK_HOME"
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          # AGP 8.13 defaults to 35.0.0; APK inspection explicitly uses 36.0.0.
          # Authenticate retained tools before any fresh-image cleanup.
          for revision in 35.0.0 36.0.0; do
            selected="/usr/local/lib/android/sdk/build-tools/$revision"
            test -d "$selected"
            test ! -L "$selected"
            test "$(realpath "$selected")" = "$selected"
            actual=$(sed -n 's/^Pkg.Revision *= *//p' "$selected/source.properties" | tr -d '\r')
            test "$actual" = "$revision"
          done
          # Validate the complete fixed removal set before deleting any of it.
          # Other versions and all platforms, sources and artifacts are preserved.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
            fi
          done
          python3 -c 'import shutil; print("freshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          df -h "$GITHUB_WORKSPACE"
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              test "$(realpath "$unused")" = "$unused"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          df -h "$GITHUB_WORKSPACE"
          # Exact preinstalled image versions only; neither is the selected 28.2 NDK.
          for revision in 27.3.13750724 29.0.14206865; do
            unused="/usr/local/lib/android/sdk/ndk/$revision"
            if [ -e "$unused" ]; then
              test "$unused" != "$ANDROID_NDK_HOME"
              test "$(realpath "$unused")" = "$unused"
              actual=$(sed -n 's/^Pkg.Revision *= *//p' "$unused/source.properties" | tr -d '\r')
              test "$actual" = "$revision"
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          # Exact unused build-tools revisions from ubuntu24/20260927.320 only.
          for revision in 34.0.0 35.0.1 36.1.0 37.0.0; do
            unused="/usr/local/lib/android/sdk/build-tools/$revision"
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          grep -Eq '^Pkg.Revision *= *28\.2\.13676358[[:space:]]*$' "$ANDROID_NDK_HOME/source.properties"
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("freshCapacityAfterBytes="+str(free)); assert free >= 32*1024**3, "Fresh runner needs at least 32GiB for resident archive headroom"'
          df -h "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"
      - name: Admit exact tools and fresh source paths
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(node --version)" = "v24.15.0"
          test "$(bun --version)" = "1.4.2"
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          echo "ALPHA_LOCAL_AGENT_SOURCE_DIR=$GITHUB_WORKSPACE/artifacts/resident-ci-92fc" >> "$GITHUB_ENV"
          echo "ALPHA_WORKFLOW_WORKER_OUTPUT=$GITHUB_WORKSPACE/artifacts/worker-ci-92fc" >> "$GITHUB_ENV"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Qualify supervisor on real Linux processes
        timeout-minutes: 10
        run: |
          python3 scripts/ci/test-resident-phase.py
          python3 test/resident-crash-diagnostic.test.py
      - name: Install pinned Android native toolchain
        run: |
          python3 scripts/ci/resident-phase.py --name android-toolchain --seconds 1200 sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          # The speech wrappers require the CMake release of the qualified build.
          python3 -m pip install cmake==4.0.3
          test "$(cmake --version | head -1)" = "cmake version 4.0.3"
      - run: python3 scripts/ci/resident-phase.py --name product-install --seconds 600 npm ci
      # Pinned in-browser speech model (size/hash verified on every use; Android prunes it).
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eliza/browser-speech
          key: browser-speech-${{ hashFiles('config/browser-speech.json') }}
      - name: Acquire verified browser speech model
        timeout-minutes: 10
        run: npm run browser-speech:prepare
      - run: node --test vendor/eliza/packages/os/scripts/__tests__/stage-launcher-overlay.node.test.ts
      # Cache only acquisition inputs. Every hit is size/hash verified; generated
      # AARs, extracted sources and models are rebuilt in this clean job.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .eliza/local-speech/downloads
          key: speech-downloads-${{ runner.os }}-${{ hashFiles('vendor/eliza/packages/app/scripts/local-speech/download-manifest.json') }}
      - name: Acquire verified speech source, models and license references
        timeout-minutes: 15
        run: |
          python3 scripts/ci/resident-phase.py --name speech-downloads --seconds 900 python3 scripts/local-speech/acquire-downloads.py
          python3 scripts/ci/resident-phase.py --name lexicon --seconds 600 python3 scripts/local-speech/make-lexicon.py
      - name: Build and qualify both no-eSpeak runtime ABIs
        timeout-minutes: 65
        run: |
          for abi in arm64-v8a x86_64; do
            python3 scripts/ci/resident-phase.py --name speech-build-$abi --seconds 3900 python3 scripts/local-speech/build-no-espeak.py --abi "$abi" --ndk "$ANDROID_NDK_HOME" --jobs 2
            python3 scripts/ci/resident-phase.py --name strip-$abi --seconds 600 python3 scripts/local-speech/strip-runtime.py --abi "$abi" --ndk "$ANDROID_NDK_HOME"
          done
          python3 scripts/ci/resident-phase.py --name speech-verify --seconds 600 python3 scripts/local-speech/verify-source.py
      - name: Assemble and verify speech APK inputs
        run: |
          python3 scripts/ci/resident-phase.py --name speech-assets --seconds 600 python3 scripts/local-speech/prepare-assets.py
          python3 scripts/ci/resident-phase.py --name speech-assemble --seconds 600 python3 scripts/local-speech/assemble-runtime.py
          python3 scripts/ci/resident-phase.py --name speech-install --seconds 600 python3 scripts/local-speech/install-generated.py --repository "$GITHUB_WORKSPACE" --allow-unqualified-runtime
      - name: Prepare and qualify fresh resident source with normal hooks
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          python3 scripts/ci/resident-phase.py --name prepare --seconds 3600 npm run agent:prepare
          python3 scripts/ci/resident-phase.py --name device-timing-flow --seconds 600 npm run agent:test-device-timing
          python3 scripts/ci/resident-phase.py --name worker-build --seconds 900 npm run agent:build-workflow-worker
          python3 scripts/ci/resident-phase.py --name compiler-flow --seconds 600 npm run agent:test-workflow-compiler
          python3 scripts/ci/resident-phase.py --name worker-flow --seconds 600 npm run agent:test-workflow-worker
      - name: Acquire hash-pinned Android Bun with step-only authentication
        timeout-minutes: 12
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/resident-phase.py --name bun-downloads --seconds 600 python3 scripts/ci/acquire-resident-bun.py
      - name: Stage and archive qualified resident runtime
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          RUN_TURBO_CONCURRENCY: "1"
        run: |
          python3 scripts/ci/resident-phase.py --name runtime-stage --seconds 1800 npm run agent:stage-android
          python3 scripts/ci/resident-phase.py --name mobile-bundle --seconds 300 npm run agent:test-mobile-workflow-bundle
          # Fresh native artifacts and the runtime pin are inputs to shipped notices.
          python3 scripts/ci/resident-phase.py --name license-notices --seconds 120 node scripts/generate-licenses.mjs --packaged-runtime
          # Flag-off distribution: release verification requires the PACKAGED runtime.
          python3 scripts/ci/resident-phase.py --name distribution-archive --seconds 3000 node scripts/build-archive.mjs test-results/resident-ci-distribution
          # The native suites need the private peer fixture, a debug-only test hook
          # that exists only in the separate, never-distributable test-mocks build.
          python3 scripts/ci/resident-phase.py --name archive --seconds 3000 node scripts/build-archive.mjs --test-mocks test-results/resident-ci-archive
      - name: Build and anchor private endpoint helper
        run: python3 scripts/ci/build-private-peer.py
      - name: Preserve native generated provenance
        run: cp android/app/build/generated/local-agent/source-manifest.json test-results/resident-ci-archive/native-generated-source-manifest.json
      - name: Anchor exact archive manifest
        id: freeze
        run: echo "sha256=$(sha256sum test-results/resident-ci-archive/apk-manifest.json | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      # build-archive.mjs retains each release R8 mapping (<variant>-release-mapping.txt,
      # hashed in release-mappings.json) beside the APKs, so both archives carry them.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: apks
        with:
          name: resident-archive-${{ github.sha }}-${{ github.run_id }}
          path: test-results/resident-ci-archive/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 3
          name: resident-build-evidence-${{ github.run_id }}
          path: |
            test-results/resident-ci-supervisor/
            test-results/resident-ci/
            test-results/resident-ci-distribution/
            android/app/build/reports/
  native:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ALPHA_RESIDENT_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      # Fresh native job has its own stock hosted image; build-job cleanup does
      # not carry over. Provision before tools, artifacts or the AVD are created.
      - name: Provision native capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # Fixed unused language installations only; preserve every Android SDK,
          # source checkout, dependency cache and downloaded build artifact.
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
            fi
          done
          python3 -c 'import shutil; print("nativeFreshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("nativeFreshCapacityAfterBytes="+str(free)); assert free >= 24*1024**3, "Fresh native runner needs 24GiB before SDK, archive and AVD provisioning"'
          # Existing 10GiB admission and 4GiB runtime floor remain unchanged.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install exact APK inspection tools
        run: sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: test-results/resident-ci-archive
          merge-multiple: true
      - name: Require fresh capacity and KVM
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 python3 scripts/ci/resident-phase.py --name prepare-phone --seconds 300 node scripts/prepare-ci-emulator.mjs
            ANDROID_SERIAL=emulator-5554 ALPHA_RESIDENT_DISPOSABLE_CI=1 python3 scripts/ci/resident-phase.py --name native --seconds 5400 python3 scripts/ci/resident-native.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 3
          name: resident-native-evidence-${{ github.run_id }}
          path: |
            test-results/resident-ci-supervisor/
            test-results/resident-ci/
            test-results/resident-ci-native/

  recovery-ui:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ALPHA_RESIDENT_MANIFEST_SHA256: ${{ needs.build.outputs.manifest_sha256 }}
      ALPHA_RECOVERY_SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.source_sha }}
          submodules: true
      # Fresh native job has its own stock hosted image; build-job cleanup does
      # not carry over. Provision before tools, artifacts or the AVD are created.
      - name: Provision native capacity on the disposable hosted runner
        run: |
          test "$GITHUB_ACTIONS" = "true"
          test "$RUNNER_ENVIRONMENT" = "github-hosted"
          # Fixed unused language installations only; preserve every Android SDK,
          # source checkout, dependency cache and downloaded build artifact.
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            test ! -L "$unused"
            if [ -e "$unused" ]; then
              test -d "$unused"
              test "$(realpath "$unused")" = "$unused"
            fi
          done
          python3 -c 'import shutil; print("nativeFreshCapacityBeforeBytes="+str(shutil.disk_usage(".").free))'
          for unused in /usr/share/dotnet /usr/local/.ghcup /usr/local/swift /usr/share/swift /opt/ghc /usr/local/share/powershell /opt/hostedtoolcache/CodeQL; do
            if [ -e "$unused" ]; then
              sudo du -sh "$unused"
              sudo rm -rf -- "$unused"
            fi
          done
          python3 -c 'import shutil; free=shutil.disk_usage(".").free; print("nativeFreshCapacityAfterBytes="+str(free)); assert free >= 24*1024**3, "Fresh native runner needs 24GiB before SDK, archive and AVD provisioning"'
          # Existing 10GiB admission and 4GiB runtime floor remain unchanged.
      - name: Qualify owned secondary recovery guards
        run: |
          python3 scripts/ci/test-recovery-ui-guard.py
          python3 scripts/ci/test-pending-recovery-phases.py
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools build-tools;36.0.0
          log-accepted-android-sdk-licenses: false
      - name: Install exact APK inspection tools
        run: sdkmanager "build-tools;36.0.0"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: test-results/resident-ci-archive
          merge-multiple: true
      - name: Require fresh capacity and KVM
        run: |
          python3 -c 'import shutil; assert shutil.disk_usage(".").free >= 10*1024**3'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: pixel_7
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            ANDROID_SERIAL=emulator-5554 python3 scripts/ci/resident-phase.py --name prepare-phone --seconds 300 node scripts/prepare-ci-emulator.mjs
            ANDROID_SERIAL=emulator-5554 ALPHA_RESIDENT_DISPOSABLE_CI=1 python3 scripts/ci/resident-phase.py --name pending-recovery-ui --seconds 2400 python3 scripts/ci/pending-recovery-ui.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          retention-days: 3
          name: pending-recovery-ui-evidence-${{ github.run_id }}
          path: |
            test-results/resident-ci-supervisor/
            test-results/resident-ci/
            test-results/pending-recovery-ui-native/
