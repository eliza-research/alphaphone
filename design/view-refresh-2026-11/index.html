<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpha Phone · view refresh · before / after</title>
<style>
@font-face{font-family:'Public Sans';src:url(/apps/app/public/fonts/5ed4d31c988e73b25889.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:'Denton';src:url(/apps/app/public/denton-300.woff2) format('woff2');font-weight:100 900}
:root{--bg:#fff;--s1:#FAFAFA;--s2:#F3F3F3;--s3:#E9E9E9;--line:#E3E3E3;--fg:#000;--mut:#6B6B6B;--acc:#0000FF;--page:#ECECEA;--ok:#0a7a2f;--warn:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--fg);font-family:'Public Sans',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit}
.serif{font-family:'Denton',Georgia,serif;font-weight:300}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;flex-shrink:0}
svg.i.sm{width:18px;height:18px}
/* page chrome */
.top{position:sticky;top:0;z-index:50;background:rgba(236,236,234,.92);backdrop-filter:blur(8px);border-bottom:1px solid #d6d6d2;display:flex;align-items:center;gap:18px;padding:12px 28px}
.top h1{font-size:22px;margin:0;font-weight:300;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:999px;font-weight:500;color:#444}
.tabs button[aria-selected=true]{background:#000;color:#fff}
.top .sp{flex:1}
.pill-btn{padding:9px 16px;border-radius:999px;background:var(--acc);color:#fff;font-weight:600;white-space:nowrap}
.pill-btn.ghost{background:#fff;color:#000;border:1px solid #ccc}
main{padding:24px 28px 80px}
.view{display:none}.view.on{display:block}
.intro{max-width:1180px;margin:0 0 18px;color:#333;line-height:1.5}
.pair{display:grid;grid-template-columns:auto auto minmax(340px,1fr);gap:28px;align-items:start}
@media (max-width:1250px){.pair{grid-template-columns:auto auto}.pair aside{grid-column:1/-1}}
figure{margin:0}
figcaption{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
figcaption .tag{font-size:11px;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid #ccc;font-weight:600}
figcaption .tag.after{background:var(--acc);color:#fff;border-color:var(--acc)}
.shots{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;max-width:360px}
.shots button{font-size:12px;padding:5px 10px;border-radius:999px;background:#fff;border:1px solid #ccc}
.shots button[aria-pressed=true]{background:#000;color:#fff;border-color:#000}
/* phone */
.phone{width:360px;height:800px;border-radius:46px;border:10px solid #111;background:#fff;position:relative;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.18);isolation:isolate}
.phone.before img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.mk{position:absolute;transform:translate(-50%,-50%);width:24px;height:24px;border-radius:50%;background:#e0002a;color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(224,0,42,.25);pointer-events:none;z-index:2}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);overflow:hidden}
.sb{height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 22px;font-size:12px;font-weight:600}
.dark .sb,.sb.dark{color:#fff}
.hdr{height:52px;flex-shrink:0;display:flex;align-items:center;gap:6px;padding:0 10px 0 6px}
.hdr .t{font-size:20px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;display:grid;place-items:center;border-radius:22px}
.ib:hover{background:var(--s2)}
.dark .ib:hover{background:rgba(255,255,255,.12)}
.tbtn{height:36px;padding:0 12px;border-radius:18px;font-weight:600;font-size:15px}
.tbtn:hover{background:var(--s2)}
.body{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}
/* agent pill */
.apill{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;background:var(--s2);border-radius:30px;padding:5px 12px 5px 5px;box-shadow:0 6px 20px rgba(0,0,0,.08);z-index:20}
.apill .orb{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 50%,#0000ff 0 30%,#3c3cff 31% 45%,#9a9aff 46% 60%,#0000ff 61% 100%)}
.apill .lbl{color:var(--mut);font-size:14px;padding:0 6px}
.dark .apill{background:rgba(40,40,40,.92);color:#fff}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.18);z-index:40;padding:10px 16px 22px;color:#000;animation:up .2s ease}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:#ccc;margin:0 auto 12px}
.sheet h3{margin:4px 4px 10px;font-size:15px}
.sug{display:block;width:100%;padding:12px 14px;border-radius:14px;background:var(--s2);margin-top:8px;font-size:14px}
.sug:hover{background:var(--s3)}
.sug small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.25);z-index:35}
.toast{position:absolute;left:16px;right:16px;bottom:78px;background:#111;color:#fff;border-radius:14px;padding:12px 14px;z-index:45;display:flex;align-items:center;gap:10px;font-size:13.5px;animation:up .2s ease}
.toast .act{margin-left:auto;color:#9db2ff;font-weight:600}
.reply{position:absolute;left:12px;right:12px;bottom:78px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 14px;z-index:45;box-shadow:0 8px 24px rgba(0,0,0,.12);font-size:13.5px;display:flex;gap:10px;align-items:flex-start;animation:up .2s ease;color:#000}
.reply .o{width:22px;height:22px;border-radius:50%;background:var(--acc);flex-shrink:0}
.review{position:absolute;left:12px;right:12px;bottom:78px;background:#fff;border-radius:20px;padding:16px;z-index:46;box-shadow:0 10px 30px rgba(0,0,0,.2);color:#000}
.review b{display:block;margin-bottom:4px;font-size:15px}
.review .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.review .row button{padding:9px 16px;border-radius:18px;font-weight:600}
.review .row .pri{background:var(--acc);color:#fff}
.review .row .sec{background:var(--s2)}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 6px 0 12px;border-radius:16px;background:#E6E6FF;color:#00008a;font-weight:600;font-size:13px}
.chip button{width:24px;height:24px;border-radius:12px;display:grid;place-items:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none;flex-shrink:0}
.chips::-webkit-scrollbar{display:none}
.fchip{height:34px;padding:0 14px;border-radius:17px;background:var(--s2);font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.fchip[aria-pressed=true]{background:#000;color:#fff}
/* segmented */
.seg{display:flex;gap:22px;padding:0 18px 8px;flex-shrink:0}
.seg button{font-size:15px;font-weight:600;color:var(--mut);padding:6px 0;border-bottom:2px solid transparent}
.seg button[aria-selected=true]{color:#000;border-color:#000}
/* photos */
.dayh{position:sticky;top:0;z-index:3;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);padding:14px 16px 8px;font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.dayh small{font-weight:400;color:var(--mut);font-size:12.5px}
.grid{display:grid;gap:2px}
.grid.inset{padding:0 12px;gap:4px}
.grid.inset .tile{border-radius:6px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:var(--s3);cursor:pointer;user-select:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;transition:transform .12s}
.tile .dur{position:absolute;right:5px;bottom:4px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .fav{position:absolute;left:5px;bottom:4px;color:#fff;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.tile .left{position:absolute;left:5px;bottom:4px;color:#fff;font-size:11px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.tile .ck{position:absolute;right:5px;top:5px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.15);box-shadow:0 0 3px rgba(0,0,0,.3)}
.tile.sel img{transform:scale(.86);border-radius:6px}
.tile.sel{background:#dfe3ff}
.tile.sel .ck{background:var(--acc);border-color:#fff;display:grid;place-items:center}
.tile.sel .ck::after{content:'';width:9px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.abar{position:absolute;left:0;right:0;bottom:0;height:78px;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:center;padding-bottom:8px;z-index:22}
.abar button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:#000;padding:6px 10px;border-radius:12px}
.abar button:hover{background:var(--s2)}
.abar button[disabled]{opacity:.35}
.albums{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:4px 16px 16px}
.alb .cv{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--s2);display:grid;place-items:center;color:var(--mut)}
.alb .cv img{width:100%;height:100%;object-fit:cover}
.alb b{display:block;margin-top:8px;font-size:14px}
.alb span{color:var(--mut);font-size:12.5px}
.row{display:flex;align-items:center;gap:14px;padding:12px 16px;width:100%;text-align:left}
.row:hover{background:var(--s1)}
.row .ic{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex-shrink:0;overflow:hidden}
.row .ic img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .tx span{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ct{color:var(--mut);font-size:13px}
.row.sel{background:#E6E6FF}
.sect{padding:16px 16px 4px;font-size:12px;color:var(--mut);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.viewer{position:absolute;inset:0;background:#000;color:#fff;z-index:30;display:flex;flex-direction:column}
.viewer .img{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
.viewer .img img{max-width:100%;max-height:100%}
.viewer .chrome{transition:opacity .15s}
.viewer.hide .chrome{opacity:0;pointer-events:none}
.viewer .vt{flex:1;text-align:center;line-height:1.15}
.viewer .vt b{display:block;font-size:15px}
.viewer .vt span{font-size:12px;color:#bbb}
.viewer .vbar{height:72px;display:flex;justify-content:space-around;align-items:center;padding-bottom:10px}
.nav{position:absolute;top:50%;width:44px;height:64px;transform:translateY(-50%);display:grid;place-items:center;color:#fff;opacity:.6}
.nav:hover{opacity:1}
.info{background:#fff;color:#000}
.info dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0 4px}
.info dt{color:var(--mut)}
.info dd{margin:0}
/* camera */
.cam{background:#000;color:#fff}
.vf{position:relative;flex:1;margin:0;overflow:hidden;background:#000}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .25s, transform .3s}
.vf .flashfx{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.vf .flashfx.go{animation:fl .25s ease}
@keyframes fl{0%{opacity:.9}100%{opacity:0}}
.zoom{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:8px}
.zoom button{width:36px;height:36px;border-radius:18px;background:rgba(0,0,0,.45);font-size:12px;font-weight:700;color:#fff}
.zoom button[aria-pressed=true]{background:#fff;color:#000;width:42px;height:42px;margin-top:-3px}
.modes{display:flex;justify-content:center;gap:26px;padding:14px 0 6px;font-weight:600;font-size:14px}
.modes button{color:#999;position:relative}
.modes button[aria-pressed=true]{color:#fff}
.modes button[aria-pressed=true]::after{content:'';position:absolute;left:50%;bottom:-7px;width:4px;height:4px;border-radius:2px;background:#fff;transform:translateX(-50%)}
.ctl{height:118px;display:flex;align-items:center;justify-content:space-between;padding:0 34px 18px}
.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;display:grid;place-items:center}
.shutter i{width:60px;height:60px;border-radius:50%;background:#fff;transition:all .15s}
.shutter.vid i{background:#e5262a}
.shutter.rec i{width:26px;height:26px;border-radius:6px;background:#e5262a}
.thumb{width:52px;height:52px;border-radius:12px;overflow:hidden;border:2px solid #aaa;background:#222}
.thumb img{width:100%;height:100%;object-fit:cover}
.flip{width:52px;height:52px;border-radius:26px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.recchip{position:absolute;top:12px;left:50%;transform:translateX(-50%);background:#e5262a;color:#fff;padding:4px 10px;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;z-index:3}
.docframe{position:absolute;inset:16% 12% 22%;border:2px solid #ffd60a;border-radius:8px;box-shadow:0 0 0 2000px rgba(0,0,0,.25)}
/* notes */
.nlist .row{align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--s3)}
.nlist .row .tx span{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.ngrid{columns:2;column-gap:10px;padding:4px 12px}
.ncard{break-inside:avoid;display:block;width:100%;background:var(--s2);border-radius:16px;padding:12px 14px;margin-bottom:10px;text-align:left}
.ncard b{display:block;font-weight:600;margin-bottom:4px}
.ncard span{color:#333;font-size:13px;white-space:pre-line;display:block}
.ncard em{display:block;color:var(--mut);font-size:12px;font-style:normal;margin-top:8px}
.edit{padding:4px 20px}
.edit h2{font-size:24px;margin:6px 0 4px;outline:none;font-weight:600}
.edit .meta{color:var(--mut);font-size:12.5px;margin-bottom:12px}
.edit .tb{outline:none;line-height:1.55;white-space:pre-wrap;font-size:15.5px;min-height:200px}
.check{display:flex;gap:10px;align-items:center;padding:6px 0;font-size:15.5px}
.check i{width:20px;height:20px;border-radius:6px;border:2px solid #000;flex-shrink:0}
.check.done{color:var(--mut);text-decoration:line-through}
.check.done i{background:#000}
.menu{position:absolute;right:10px;top:84px;background:#fff;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.2);z-index:41;min-width:200px;padding:6px;color:#000}
.menu button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:10px}
.menu button:hover{background:var(--s2)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.rec{display:flex;flex-direction:column;align-items:center;flex:1;padding:20px}
.rec .timer{font-size:72px;font-variant-numeric:tabular-nums;margin-top:40px}
.wave{display:flex;align-items:center;gap:3px;height:120px;margin:30px 0 10px;width:100%;justify-content:center}
.wave i{width:4px;border-radius:2px;background:var(--acc);transition:height .1s}
.rec .live{color:var(--mut);font-size:14px;text-align:center;line-height:1.5;min-height:66px;padding:0 10px}
.rec .btns{margin-top:auto;display:flex;align-items:center;gap:34px;padding-bottom:30px}
.rbtn{width:56px;height:56px;border-radius:28px;background:var(--s2);display:grid;place-items:center}
.rbig{width:78px;height:78px;border-radius:39px;background:#e5262a;color:#fff;display:grid;place-items:center}
.player{display:flex;align-items:center;gap:12px;background:var(--s2);border-radius:16px;padding:10px 14px;margin:6px 0 14px}
.player .pw{flex:1;display:flex;gap:2px;align-items:center;height:28px}
.player .pw i{width:3px;border-radius:2px;background:#999}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
/* files */
.crumb{padding:0 18px 8px;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex-shrink:0}
.crumb button{color:var(--mut)}
.crumb button:hover{color:#000;text-decoration:underline}
.store{padding:0 16px 6px 70px;margin-top:-6px}
.bar{height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.bar i{display:block;height:100%;background:#000}
.preview{position:absolute;inset:0;background:#fff;z-index:30;display:flex;flex-direction:column}
.preview .pv{flex:1;display:grid;place-items:center;background:var(--s1);margin:0 12px 12px;border-radius:16px;overflow:hidden}
.preview .pv img{max-width:100%;max-height:100%}
.doc{width:180px;height:240px;background:#fff;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:22px 18px;display:flex;flex-direction:column;gap:8px}
.doc i{display:block;height:6px;border-radius:3px;background:var(--s3)}
/* apps */
.home{padding:10px 18px}
.hcards{display:flex;gap:12px;margin:6px 0 40px}
.hcard{width:270px;height:170px;border-radius:24px;background:var(--acc);color:#fff;padding:18px 20px;flex-shrink:0}
.hcard .serif{font-size:30px;line-height:1.05;margin-top:28px}
.hcard2{flex:1;border-radius:24px;background:var(--s2)}
.hgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 6px}
.happ{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#555}
.happ .ic{width:60px;height:60px;border-radius:20px;background:var(--s2);display:grid;place-items:center;color:#000}
.happ.hl .ic{box-shadow:0 0 0 3px var(--acc)}
.drawer{position:absolute;inset:30px 0 0;background:#fff;z-index:30;display:flex;flex-direction:column}
.drawer h2{font-size:34px;margin:0;flex:1}
.search{margin:4px 16px 12px;height:46px;border-radius:23px;background:var(--s2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mut)}
.search input{border:0;background:none;outline:none;flex:1;font-size:15px;color:#000}
.agrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 4px;padding:6px 10px 100px}
.aapp{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:12px;color:#222;position:relative}
.aapp .ai{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff}
.aapp .ai svg{width:26px;height:26px}
.ctx{position:absolute;z-index:41;background:#fff;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.2);padding:6px;min-width:170px;color:#000}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 10px;border-radius:9px;font-size:13.5px}
.ctx button:hover{background:var(--s2)}
.edithome .happ .ic{animation:wig .3s ease-in-out infinite alternate}
@keyframes wig{from{transform:rotate(-1.5deg)}to{transform:rotate(1.5deg)}}
.happ .rm{position:absolute;margin:-6px 0 0 44px;width:22px;height:22px;border-radius:11px;background:#000;color:#fff;display:grid;place-items:center;font-size:14px;line-height:1;z-index:2}
/* aside */
aside{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 2px 10px rgba(0,0,0,.05);line-height:1.5;min-width:0}
aside h3{margin:0 0 8px;font-size:15px}
aside h4{margin:18px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#555}
aside ol,aside ul{margin:0;padding-left:20px}
aside li{margin:4px 0}
aside code{font-size:12px;background:#f2f2f0;padding:1px 5px;border-radius:5px}
.chg{list-style:none;padding:0;margin:0}
.chg li{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0f0ee;margin:0}
.chg input{margin-top:3px;width:16px;height:16px;accent-color:var(--ok);flex-shrink:0}
.chg .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e0002a;color:#fff;font-size:11px;font-weight:700;flex-shrink:0;margin-top:1px}
.chg .n.add{background:var(--acc)}
.dec{border:1px solid #e3e3e0;border-radius:14px;padding:12px 14px;margin:10px 0}
.dec b{display:block;margin-bottom:6px}
.dec label{display:flex;gap:8px;align-items:flex-start;margin:5px 0;cursor:pointer}
.dec label input{margin-top:4px;accent-color:var(--acc)}
.dec .rec{color:var(--ok);font-weight:600;font-size:12px}
textarea.cm{width:100%;min-height:70px;border:1px solid #ddd;border-radius:12px;padding:10px 12px;resize:vertical;margin-top:6px}
details{margin-top:12px;border-top:1px solid #eee;padding-top:10px}
summary{cursor:pointer;font-weight:600}
.sim{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sim button{padding:6px 11px;border-radius:999px;background:#f2f2f0;font-size:12.5px;border:1px solid #e3e3e0}
.sim button[aria-pressed=true]{background:#000;color:#fff;border-color:#000}
.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.steps ol{font-size:12.5px;padding-left:18px}
.steps .bad li::marker{color:#b3261e}
.steps .good li::marker{color:var(--ok)}
.muted{color:#666}
.planwrap{max-width:1000px;background:#fff;border-radius:20px;padding:24px 30px;line-height:1.55}
.planwrap table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0 16px}
.planwrap td,.planwrap th{border:1px solid #e6e6e3;padding:6px 8px;vertical-align:top;text-align:left}
.out{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#f6f6f4;border-radius:12px;padding:14px;max-height:360px;overflow:auto}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mut);padding:80px 20px;gap:10px}
</style>
</head>

 x.innerHTML=`<h3>${v.label}: what changes</h3><p class="muted" style="margin:0 0 6px;font-size:12.5px">Red numbers match the markers on the before screenshot. Tick each change you approve.</p>
 <ul class="chg">${v.changes.map(([k,t],i)=>{const n=(t.match(/\((\d)(?:, (\d))?\)/)||[]);return `<li><input type="checkbox" data-i="${i}" ${r.ok[i]?'checked':''} aria-label="Approve change ${i+1}"><span class="n ${k==='−'?'':'add'}" title="${kind[k]}">${k}</span><span>${t}</span></li>`}).join('')}</ul>
 <h4>Decisions</h4>${v.decisions.map(d=>`<div class="dec"><b>${d.id} · ${d.q}</b>${d.o.map((o,j)=>`<label><input type="radio" name="${d.id}" value="${j}" ${(r.dec[d.id]??d.r)==j?'checked':''}><span>${o}</span></label>`).join('')}</div>`).join('')}

 x.onchange=e=>{const t=e.target;if(t.type==='checkbox')r.ok[t.dataset.i]=t.checked;if(t.type==='radio'){r.dec[t.name]=+t.value;const d=v.decisions.find(d=>d.id===t.name);if(d.sim==='grid'){PH.style=t.value==='1'?'inset':'edge';R.photos()}if(d.sim==='nlayout'){NT.layout=t.value==='1'?'grid':'list';R.notes()}if(d.sim==='alayout'){AP.layout=t.value==='1'?'list':'grid';R.apps()}}saveRev()};
 x.oninput=e=>{if(e.target.classList.contains('cm')){r.cm=e.target.value;saveRev()}};

}
function camSteps(){return `<h4>Start sequence (native)</h4><div class="steps"><div class="bad"><b style="font-size:12.5px">Today, sequential</b><ol><li>render → rAF → <code>sync()</code></li><li>await previous stop</li><li>bridge → stop again → permission</li><li><code>ProcessCameraProvider</code> cold init</li><li>bind Preview + ImageCapture(max quality) + VideoCapture</li><li>restore WB → exposure → EV → zoom → flash → focus, one after another</li><li>JS <code>mask()</code> DOM walk; viewfinder black until here</li><li>40 base64 thumbnails over the bridge for one tile</li></ol></div><div class="good"><b style="font-size:12.5px">Proposed</b><ol><li>CameraX provider prewarmed at app start</li><li>bind Preview + ImageCapture (min latency); Video binds on mode switch</li><li>resolve on first frame; settings restore in parallel, defaults skipped</li><li>unmask on first frame</li><li>last thumbnail: <code>limit:1</code>, after ready</li><li>chat sheet &lt; 10 s keeps the session</li></ol></div></div><p class="muted" style="font-size:12.5px">Targets to measure on the Pixel 10a: cold first frame &lt; 400 ms, warm &lt; 200 ms, shutter → thumbnail &lt; 250 ms. Today’s numbers are measured in phase 0; this review doesn’t claim any.</p>`}

function bindPhone(el,S,handlers){
 el.onclick=e=>{const b=e.target.closest('[data-a]');if(!b||!el.contains(b))return;const a=b.dataset.a;
  if(a==='ask'){S.ask=S.suggest();S.reply=null;R[S.k]();return}

  if(a==='undo'){const f=S.toast&&S.toast.undo;S.toast=null;if(f)f();R[S.k]();return}
  handlers[a]&&handlers[a](b,e)};

/* ================================================================= FILES */
const FL={k:'files',path:null,root:null,sel:null,sort:'date',menu:false,filter:null,prev:null};
function nodeAt(path){let n=DB.fs;for(const s of path)n=n.kids[s];return n}
function walk(n,path=[],out=[]){for(const [k,v] of Object.entries(n.kids||{})){if(v.kids)walk(v,[...path,k],out);else out.push({name:k,path:[...path,k],...v})}return out}
const CATS={Downloads:{icon:'dl',q:f=>f.path[0]==='Download'},Images:{icon:'img',q:f=>/^image\//.test(f.mime)},Videos:{icon:'vid',q:f=>/^video\//.test(f.mime)},Audio:{icon:'aud',q:f=>/^audio\//.test(f.mime)},Documents:{icon:'docs',q:f=>/pdf|word|excel|sheet|text|msword/.test(f.mime)}};
const fIcon=f=>f.src?`<img src="${f.src}" alt="">`:ic(/^audio/.test(f.mime)?'aud':/^video/.test(f.mime)?'vid':/^image/.test(f.mime)?'img':'docs');
const fmeta=f=>`${f.size} · ${fmtShort(f.date)}`;
function sorted(l){return l.sort(FL.sort==='name'?(a,b)=>a.name.localeCompare(b.name):FL.sort==='size'?(a,b)=>parseFloat(b.size)*(/MB/.test(b.size)?1024:1)-parseFloat(a.size)*(/MB/.test(a.size)?1024:1):(a,b)=>b.date-a.date)}
R.files=()=>{
 const S=FL,el=document.getElementById('a-files');const all=walk(DB.fs);
 let head,body,crumb='';
 const rowF=f=>`<button class="row ${S.sel&&S.sel.has(f.path.join('/'))?'sel':''}" data-a="file" data-p="${esc(f.path.join('/'))}"><span class="ic">${fIcon(f)}</span><span class="tx"><b>${esc(f.name)}</b><span>${fmeta(f)}</span></span></button>`;
 const rowD=(name,path,count)=>`<button class="row" data-a="dir" data-p="${esc(path.join('/'))}"><span class="ic">${ic('folder')}</span><span class="tx"><b>${esc(name)}</b></span><span class="ct">${count}</span></button>`;
 const selHead=()=>`<div class="hdr"><button class="ib" data-a="selx" aria-label="Cancel selection">${ic('x')}</button><span class="t">${S.sel.size} selected</span></div>`;
 if(S.root==='trash'){
  head=`<div class="hdr"><button class="ib" data-a="home" aria-label="Back">${ic('back')}</button><span class="t">Trash</span>${DB.ftrash.length?`<button class="tbtn" data-a="emptyt" style="color:var(--warn)">Empty</button>`:''}</div>`;
  body=DB.ftrash.length?DB.ftrash.map((f,i)=>`<button class="row" data-a="trow" data-i="${i}"><span class="ic">${fIcon(f)}</span><span class="tx"><b>${esc(f.name)}</b><span>${f.size} · from ${esc(f.from)}</span></span><span class="ct">${30-Math.round((NOW-f.deleted)/864e5)}d</span></button>`).join(''):`<div class="empty">${ic('trash')}</div>`;
 }else if(S.root==='cat'){
  const c=CATS[S.cat];let l=all.filter(c.q);
  head=S.sel?selHead():`<div class="hdr"><button class="ib" data-a="home" aria-label="Back">${ic('back')}</button><span class="t">${S.cat}</span><button class="ib" data-a="sortm" aria-label="Sort">${ic('sort')}</button></div>`;
  if(S.cat==='Images'||S.cat==='Videos'){
   const groups={};for(const f of l){const k=f.path.slice(0,-1).join('/');(groups[k]=groups[k]||[]).push(f)}
   body=Object.entries(groups).sort((a,b)=>Math.max(...b[1].map(f=>f.date))-Math.max(...a[1].map(f=>f.date))).map(([k,fs])=>`<button class="row" data-a="dir" data-p="${esc(k)}"><span class="ic">${fIcon(sorted(fs)[0])}</span><span class="tx"><b>${esc(k.split('/').pop())}</b><span>${esc(k)}</span></span><span class="ct">${fs.length}</span></button>`).join('')||`<div class="empty">${ic(c.icon)}</div>`;
  }else body=sorted(l).map(rowF).join('')||`<div class="empty">${ic(c.icon)}</div>`;
 }else if(S.root==='dir'){
  const n=nodeAt(S.path);const dirs=Object.entries(n.kids).filter(([,v])=>v.kids),files=Object.entries(n.kids).filter(([,v])=>!v.kids).map(([k,v])=>({name:k,path:[...S.path,k],...v}));
  head=S.sel?selHead():`<div class="hdr"><button class="ib" data-a="up" aria-label="Back">${ic('back')}</button><span class="t">${esc(S.path.length?S.path[S.path.length-1]:'Internal storage')}</span><button class="ib" data-a="sortm" aria-label="Sort and more">${ic('more')}</button></div>`;
  crumb=`<div class="crumb"><button data-a="crumb" data-n="0">Internal storage</button>${S.path.map((p,i)=>` › <button data-a="crumb" data-n="${i+1}">${esc(p)}</button>`).join('')}</div>`;
  body=dirs.sort((a,b)=>a[0].localeCompare(b[0])).map(([k,v])=>rowD(k,[...S.path,k],Object.keys(v.kids).length||'')).join('')+sorted(files).map(rowF).join('');
  if(!dirs.length&&!files.length)body=`<div class="empty">${ic('folder')}</div>`;
 }else{
  const cnt=k=>all.filter(CATS[k].q).length;
  head=`<div class="hdr"><button class="ib" aria-label="Back to apps">${ic('back')}</button><span class="t">Files</span></div>`;
  body=`${Object.keys(CATS).map(k=>`<button class="row" data-a="cat" data-c="${k}"><span class="ic">${ic(CATS[k].icon)}</span><span class="tx"><b>${k}</b></span><span class="ct">${cnt(k)}</span></button>`).join('')}
  <div class="sect">Storage</div><button class="row" data-a="dir" data-p=""><span class="ic">${ic('phoneS')}</span><span class="tx"><b>Internal storage</b><span>38.2 GB free of 128 GB</span></span></button><div class="store"><div class="bar"><i style="width:70%"></i></div></div>
  <button class="row" data-a="trash"><span class="ic">${ic('trash')}</span><span class="tx"><b>Trash</b></span><span class="ct">${DB.ftrash.length||''}</span></button>`;
 }
 const chip=S.filter?`<div class="chips"><span class="chip">${ic('search','sm')} ${esc(S.filter.label)} · ${all.filter(S.filter.fn).length}<button data-a="clearf" aria-label="Clear">${ic('x','sm')}</button></span></div>`:'';
 if(S.filter)body=sorted(all.filter(S.filter.fn)).map(rowF).join('');
 const bar=S.sel?`<div class="abar"><button data-a="fshare">${ic('share')}Share</button><button data-a="fmove">${ic('move')}Move</button><button data-a="fcopy">${ic('copy')}Copy</button><button data-a="fdel">${ic('trash')}Delete</button></div>`:pill();
 let pv='';
 if(S.prev){const f=walk(DB.fs).find(x=>x.path.join('/')===S.prev);if(f)pv=`<div class="preview">${sb()}<div class="hdr"><button class="ib" data-a="pvx" aria-label="Close">${ic('back')}</button><span class="t" style="font-size:16px">${esc(f.name)}</span><button class="ib" data-a="pvshare" aria-label="Share">${ic('share')}</button><button class="ib" data-a="pvdel" aria-label="Delete">${ic('trash')}</button></div><div class="crumb">${esc(['Internal storage',...f.path.slice(0,-1)].join(' › '))} · ${f.size}</div><div class="pv">${f.src?`<img src="${f.src}" alt="">`:/audio/.test(f.mime)?`<div style="text-align:center">${ic('aud')}<div class="muted" style="margin-top:8px">${esc(f.name)}</div></div>`:`<div class="doc"><b style="font-size:12px">${esc(f.name)}</b>${'<i></i>'.repeat(9)}</div>`}</div></div>`}
 const menu=S.menu?`<div class="scrim" data-a="sortm" style="background:transparent"></div><div class="menu" style="top:84px">${['date','name','size'].map(s=>`<button data-a="sortby" data-s="${s}">${ic('sort','sm')}Sort by ${s}${S.sort===s?' ✓':''}</button>`).join('')}${S.root==='dir'?`<hr><button data-a="newdir">${ic('folder','sm')}New folder</button><button data-a="selstart">${ic('check','sm')}Select</button>`:''}</div>`:'';
 el.innerHTML=`<div class="scr">${sb()}${head}${crumb}${chip}<div class="body" id="flbody">${body}<div style="height:110px"></div></div>${bar}${menu}${pv}${overlays(S)}</div>`;
 if(!el._lp){el._lp=1;longPress(el,'[data-a=file]',n=>{if(!FL.sel)FL.sel=new Set();FL.sel.add(n.dataset.p);R.files()})}
 const selFiles=()=>walk(DB.fs).filter(f=>S.sel.has(f.path.join('/')));
 const rm=f=>{const parent=nodeAt(f.path.slice(0,-1));const v=parent.kids[f.name];delete parent.kids[f.name];return v};
 const pickDest=(verb,fn)=>{S.ask=[['Download'],['Documents'],['Documents','Scans'],['Pictures'],['DCIM','Camera']].map(p=>({t:`${verb} to ${p.join(' › ')}`,run:()=>fn(p)}));R.files()};
 bindPhone(el,S,{
  home:()=>{Object.assign(S,{root:null,path:null,sel:null,filter:null});R.files()},
  cat:b=>{S.root='cat';S.cat=b.dataset.c;R.files()},
  dir:b=>{S.root='dir';S.path=b.dataset.p?b.dataset.p.split('/'):[];S.sel=null;S.filter=null;R.files()},
  up:()=>{if(!S.path.length){S.root=null;R.files();return}S.path=S.path.slice(0,-1);R.files()},
  crumb:b=>{S.path=S.path.slice(0,+b.dataset.n);R.files()},
  trash:()=>{S.root='trash';R.files()},
  file:b=>{if(S.sel){const p=b.dataset.p;S.sel.has(p)?S.sel.delete(p):S.sel.add(p);if(!S.sel.size)S.sel=null;R.files();return}S.prev=b.dataset.p;R.files()},
  pvx:()=>{S.prev=null;R.files()},pvshare:()=>flash(S,'toast',{t:'Share sheet opened'}),
  pvdel:()=>{const f=walk(DB.fs).find(x=>x.path.join('/')===S.prev);const v=rm(f);DB.ftrash.push({...v,name:f.name,from:f.path.slice(0,-1).join('/'),deleted:new Date(NOW)});if(v.photo){const p=DB.photos.find(x=>x.id===v.photo);if(p)p.trashed=NOW}save();S.prev=null;flash(S,'toast',{t:'Moved to Trash'})},
  selx:()=>{S.sel=null;R.files()},selstart:()=>{S.menu=false;S.sel=new Set();R.files()},

  emptyt:()=>{S.review={t:'Empty Trash?',d:`${DB.ftrash.length} item(s) will be removed from this phone.`,ok:'Empty',run:()=>{DB.ftrash=[];save();R.files()}};R.files()},
 });
 S.suggest=()=>[

  {t:'PDFs from this week',d:'files_filter{kind:pdf, from:Mon}',run:()=>{Object.assign(S,{root:null,sel:null,filter:{label:'PDFs this week',fn:f=>/pdf/.test(f.mime)&&f.date>=day(4,0)}});R.files()}},
  {t:'Move the invoice to Documents',d:'files_move. Reviewed before it runs',run:()=>{const f=walk(DB.fs).find(x=>/invoice/.test(x.name));if(!f){flash(S,'reply','I can’t find an invoice.');return}S.review={t:`Move “${f.name}”?`,d:`${f.path.slice(0,-1).join(' › ')} → Documents`,ok:'Move',run:()=>{const v=rm(f);DB.fs.kids.Documents.kids[f.name]=v;save();Object.assign(S,{root:'dir',path:['Documents'],filter:null});flash(S,'toast',{t:'Moved to Documents'})}};R.files()}},
  {t:'What’s taking up space?',d:'Read-only summary',run:()=>flash(S,'reply','DCIM › Camera is the largest folder. Videos are most of it. Want me to show videos over 100 MB?',4000)},

 bindPhone(el,S,{
  drawer:()=>{if(S.edit)return;S.drawer=true;S.q='';R.apps()},dclose:()=>{S.drawer=false;R.apps()},
  app:b=>flash(S,'toast',{t:`Opens ${b.dataset.n} (Android activity)`}),
  hopen:b=>{if(S.edit)return;flash(S,'toast',{t:`Opens ${(PRODUCT[b.dataset.k]||[b.dataset.k.slice(4)])[0]}`})},
  ctxx:()=>{S.ctx=null;R.apps()},
  addhome:()=>{const n=S.ctx.n;if(!DB.homeAndroid.includes(n))DB.homeAndroid.push(n);save();S.ctx=null;S.drawer=false;flash(S,'toast',{t:`Added ${n} to Home`})},
  appinfo:()=>{const n=S.ctx.n;S.ctx=null;flash(S,'toast',{t:`Opens Android App info for ${n}`})},
  hrm:(b,e)=>{e.stopPropagation();const k=b.dataset.k;if(k.startsWith('and:'))DB.homeAndroid=DB.homeAndroid.filter(x=>x!==k.slice(4));else{DB.home=DB.home.filter(x=>x!==k);DB.hidden.push(k)}save();R.apps()},
  editdone:()=>{S.edit=false;R.apps()},addback:()=>{if(DB.hidden.length){S.add=true;R.apps()}},addx:()=>{S.add=false;R.apps()},
  readd:b=>{const k=b.dataset.k;DB.hidden=DB.hidden.filter(x=>x!==k);DB.home.push(k);save();S.add=DB.hidden.length>0;R.apps()},
 });
 S.suggest=()=>[];
};

/* ============================================================ PLAN + REVIEW */
function renderPlan(){
 document.getElementById('v-plan').innerHTML=`<div class="planwrap">
 <h2 class="serif" style="font-size:30px;margin:0 0 8px">Plan & decisions</h2>
 <p>The full written plan, with file references, native changes and TLA+ outlines, is in <code>design/view-refresh-2026-11/PLAN.md</code>. Nothing is implemented yet. Tick changes and pick decisions on each tab, add comments, then press <b>Copy my review</b> and paste the result back into the chat.</p>
 <h3>Cross-cutting</h3><ul>
 <li><b>No narration text.</b> Explanatory and privacy-narration lines are removed everywhere. One short line remains only for an error you need to act on.</li>
 <li><b>Search moves to the agent.</b> Photos, Notes and Files lose their search inputs. New read-only <code>*_filter</code> tools show a clearable chip in the view. Anything that changes data (move, album, delete) goes through the existing review card.</li>
 <li><b>One spec per flow,</b> next to the existing specs in <code>design/view-refresh-2026-11/tla/</code>. The as-built config reproduces today’s bugs; the fixed config gates implementation.</li></ul>
 <h3>Review findings that drive the changes</h3>
 <table><tr><th>View</th><th>Finding</th><th>Source</th></tr>
 <tr><td>Files</td><td>No tile lists a folder. Each opens <code>ACTION_OPEN_DOCUMENT</code> with only a MIME filter and no initial URI, so every location shows the picker’s Recent list</td><td><code>files-tree-adapter.ts:15-20,145</code>, <code>DailyAppsPlugin.java:132-136</code></td></tr>
 <tr><td>Notes</td><td>The 29 s cap is a leftover; the current ASR (Parakeet-TDT) has no 30 s window, and live dictation already streams</td><td><code>voice-adapter.ts:289,510</code>, <code>AlphaVoiceCloudPlugin.java:82,483</code></td></tr>
 <tr><td>Notes</td><td>Native mic peaks exist, yet the recorder says “Waveform levels are unavailable”</td><td><code>AlphaVoiceCloudPlugin.java:502</code>, <code>voice-adapter.ts:1110</code></td></tr>
 <tr><td>Photos</td><td><code>slice(-240)</code> keeps the oldest items, so the newest fall off; MediaStore changes clear the selection and close the viewer</td><td><code>camera-adapter.ts:303,402,465,961-988</code></td></tr>
 <tr><td>Photos</td><td>The viewer’s swipe and tap handlers are empty; Info opens the album manager</td><td><code>camera-adapter.ts:899,852</code></td></tr>
 <tr><td>Camera</td><td>Tap-to-focus holds <code>controlBusy</code> for up to ~10 s, and the shutter is silently dropped meanwhile</td><td><code>camera-adapter.ts:668,811</code></td></tr>
 <tr><td>Camera</td><td>The viewfinder stays black until a sequential native settings-restore chain finishes; 40 base64 thumbnails load for one tile</td><td><code>CameraPlugin.kt:1140-1195</code>, <code>camera-adapter.ts:298,518</code></td></tr>
 <tr><td>Apps</td><td>The drawer’s Favorites are the Home tiles, so product views appear twice</td><td><code>home-launcher.ts:173,318-348</code></td></tr></table>
 <h3>Phases after approval</h3><ol>
 <li>Measure camera cold and warm first frame and shutter latency on the Pixel 10a (the before numbers).</li>
 <li>Write the TLA+ specs, run as-built (reproduce the bugs), then the fixed design.</li>
 <li>Camera: header cleanup and native start and shutter work (<code>patches/eliza</code>), then re-measure.</li>
 <li>Photos, 5. Notes, 6. Files, 7. Apps.</li>
 <li value="8">Run <code>npm run verify</code> and <code>npm run android:build:local</code> (both distribution variants), then an emulator HOME-role run and a Pixel 10a device run, each reported separately.</li></ol>
 <h3>Your review so far</h3><div class="out" id="out"></div></div>`;
}
function reviewText(){
 let s='# View refresh review\n';
 for(const v of VIEWS){const r=REV[v.key]||{ok:{},dec:{},cm:''};s+=`\n## ${v.label}\n`;
  v.changes.forEach(([k,t],i)=>{s+=`- [${r.ok[i]?'x':' '}] ${k} ${t.replace(/<[^>]+>/g,'')}\n`});
  v.decisions.forEach(d=>{s+=`- ${d.id} ${d.q}: ${d.o[r.dec[d.id]??d.r]}\n`});
  if(r.cm)s+=`- Comments: ${r.cm}\n`;}
 return s;
}
document.getElementById('copyBtn').onclick=async()=>{const t=reviewText();try{await navigator.clipboard.writeText(t);}catch{}current='plan';localStorage.setItem('vr.tab','plan');show();document.getElementById('out').textContent=t;const b=document.getElementById('copyBtn');b.textContent='Copied';setTimeout(()=>b.textContent='Copy my review',1600)};
document.getElementById('resetBtn').onclick=()=>{DB=seed();save();Object.assign(PH,{sel:null,filter:null,album:null,view:null});Object.assign(NT,{folder:'All',screen:'list',filter:null});Object.assign(FL,{root:null,path:null,sel:null,filter:null,prev:null});Object.assign(AP,{drawer:false,edit:false});show()};
R.plan=()=>{const o=document.getElementById('out');if(o)o.textContent=reviewText()};
buildPage();
</script>
