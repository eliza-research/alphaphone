pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
include ':app', ':capacitor-android', ':eliza-system'
project(':capacitor-android').projectDir = new File('../node_modules/@capacitor/android/capacitor')

include ':eliza-camera'
project(':eliza-camera').projectDir = new File('../vendor/eliza/plugins/plugin-native-camera/android')


include ':eliza-location'
project(':eliza-location').projectDir = new File('../vendor/eliza/plugins/plugin-native-location/android')

// Explicit standalone synthetic witness; never packaged in Alpha Phone.
include ':notification-fixture'

include ':local-speech'
// AOSP-image-only always-on listener APK (docs/adr/0001-privileged-listener.md); never a dependency of :app.
include ':sense'
include ':eliza-network-policy'
project(':eliza-network-policy').projectDir = new File('../vendor/eliza/plugins/plugin-native-network-policy/android')



// Calendar and reminder engines come from the reviewed upstream pin.
include ':eliza-calendar'
include ':eliza-reminders'
// Admission authenticates the pin, patch bytes and complete staged source before Gradle compiles it.
def nativePatchProcess = new ProcessBuilder('node', '../scripts/prepare-patched-native.mjs').directory(settingsDir).redirectError(ProcessBuilder.Redirect.INHERIT).start()
def nativePatchOutput = nativePatchProcess.inputStream.getText('UTF-8')
if (nativePatchProcess.waitFor() != 0) throw new GradleException('Native patch admission failed')
def nativePatchSource = new groovy.json.JsonSlurper().parseText(nativePatchOutput)
gradle.ext.nativePatchReceipt = new File(nativePatchSource.root, '.source.json')
project(':eliza-system').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-system/android')
project(':eliza-calendar').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-calendar/android')
project(':eliza-reminders').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-reminders/android')
include ':elizaos-capacitor-secure-store'
project(':elizaos-capacitor-secure-store').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-secure-store/android')
include ':eliza-passwords'
project(':eliza-passwords').projectDir = new File('../vendor/eliza/plugins/plugin-native-passwords/android')

include ':eliza-notifications'
project(':eliza-notifications').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-notifications/android')

include ':eliza-owned-media'
project(':eliza-owned-media').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-media/android')

// Read-only contact records for the Alpha AOSP image (AlphaTelephonyPlugin). The upstream Capacitor
// plugin class is not registered; only its ContactsReader is used.
include ':eliza-contacts'
project(':eliza-contacts').projectDir = new File('../vendor/eliza/plugins/plugin-native-contacts/android')

include ':eliza-action-journal'
project(':eliza-action-journal').projectDir = new File(nativePatchSource.root, 'plugins/plugin-native-action-journal/android')
