// Derived from Eliza packages/app/platforms/android; versions pinned for this shell.
buildscript {
 repositories { google(); mavenCentral() }
 dependencies {
  classpath 'com.android.tools.build:gradle:8.13.0'
  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.20'
 }
}
apply from: 'variables.gradle'
allprojects { repositories { google(); mavenCentral() } }

// Shared checkouts are immutable; keep every included library's generated files in this host.
subprojects {
 def source = projectDir.canonicalFile.toPath()
 if (source.startsWith(rootProject.file('../vendor/eliza').canonicalFile.toPath()) ||
     source.startsWith(rootProject.file('../.eliza').canonicalFile.toPath())) {
  layout.buildDirectory.set(rootProject.layout.buildDirectory.dir("upstream/${project.name}"))
 }
}
